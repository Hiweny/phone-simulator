<script id="v083-natural-experiences">
(() => {
  "use strict";

  const globalObject = typeof window !== "undefined" ? window : globalThis;
  const ACTIVE_LEGACY_STATUSES = new Set(["waiting", "ready", "paused"]);
  const BLOCKED_EXPERIENCE = /嘉年华|礼物|刷了|打赏|包养|红包|转账|必须|逼你|不答应|才肯|换你|欠我/;
  const MUTUAL_ACCEPTANCE = /可以|好(?:呀|啊|的)?|行|没问题|约好|说定了|到时候|那就|当然|一起/;
  const REJECTION = /不可以|不行|不想|不要|不去|不见|不约|不一起|不太想|不愿意|不了|不好|没空|拒绝|别这样|算了|不能|没法|不方便|暂时不|改天再说/;
  const PLAN_SIGNAL = /一起|约|见面|看展|看电影|吃饭|逛|周末|周[一二三四五六日天]|明天|后天|下次|改天|到时候/;

  function cleanText(value, limit = 160) {
    return String(value || "").replace(/\s+/g, " ").trim().slice(0, limit);
  }

  function isRejected(value) {
    return REJECTION.test(cleanText(value).replace(/要不要/g, ""));
  }

  function hashText(value) {
    let hash = 2166136261;
    for (const char of String(value)) {
      hash ^= char.codePointAt(0);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0).toString(36);
  }

  function exchangeFingerprint(exchange) {
    const userMessageId = cleanText(exchange?.userMessageId, 100);
    const npcMessageId = cleanText(exchange?.npcMessageId, 100);
    const identity = userMessageId && npcMessageId
      ? [userMessageId, npcMessageId]
      : [
          cleanText(exchange?.userText),
          cleanText(exchange?.npcText),
          Number(exchange?.at) || 0,
        ];
    return `v083-${hashText([exchange?.appId, exchange?.personId, ...identity].join("\u241f"))}`;
  }

  function findTime(...texts) {
    const matches = texts.join(" ").match(/周[一二三四五六日天](?:上午|中午|下午|晚上|早上)?|明天(?:上午|中午|下午|晚上)?|后天(?:上午|中午|下午|晚上)?|这周末|周末/g) || [];
    return matches.sort((left, right) => {
      const score = (value) => (/(上午|中午|下午|晚上|早上)/.test(value) ? 2 : 0) + (/周[一二三四五六日天]/.test(value) ? 1 : 0);
      return score(right) - score(left);
    })[0] || "";
  }

  function findActivity(userText, npcText) {
    const joined = `${userText} ${npcText}`;
    const activity = joined.match(/(?:一起(?:去)?)(看展|看电影|吃饭|逛街|散步|喝咖啡|打游戏|看直播|旅行|跑步|运动|学习|复习|聊天)/);
    if (activity) return activity[1];
    const direct = joined.match(/(?:去|约着)(看展|看电影|吃饭|逛街|散步|喝咖啡|打游戏|旅行|跑步|运动)/);
    return direct?.[1] || "";
  }

  function recognizeSharedExperience(input) {
    const userText = cleanText(input?.userText);
    const npcText = cleanText(input?.npcText);
    const contextBefore = cleanText(input?.contextBefore);
    const personId = cleanText(input?.personId, 80);
    const personName = cleanText(input?.personName, 40) || "对方";
    if (!userText || !npcText || !personId) return null;
    const joined = `${contextBefore} ${userText} ${npcText}`;
    if (BLOCKED_EXPERIENCE.test(joined)) return null;
    const playerProposal = PLAN_SIGNAL.test(userText)
      && !isRejected(userText)
      && MUTUAL_ACCEPTANCE.test(npcText)
      && !isRejected(npcText);
    const npcProposal = PLAN_SIGNAL.test(contextBefore)
      && !isRejected(contextBefore)
      && MUTUAL_ACCEPTANCE.test(userText)
      && !isRejected(userText)
      && !isRejected(npcText);
    if (!playerProposal && !npcProposal) return null;
    const proposalText = npcProposal ? contextBefore : userText;
    const activity = findActivity(proposalText, npcText);
    const time = findTime(userText, npcText, contextBefore);
    if (!activity && !time) return null;
    const summary = activity
      ? `你和${personName}约好${time || "之后"}一起${activity}。`
      : `你和${personName}约好${time}再联系。`;
    const at = Number(input?.at) || Date.now();
    return {
      id: exchangeFingerprint({ ...input, at }),
      personId,
      personName,
      appId: input?.appId === "wechat" ? "wechat" : "qq",
      summary,
      at,
      source: "natural_chat",
    };
  }

  function copyPerson(person) {
    return {
      ...person,
      memory: {
        ...(person?.memory || {}),
        episodes: Array.isArray(person?.memory?.episodes) ? [...person.memory.episodes] : [],
        relationshipEvents: Array.isArray(person?.memory?.relationshipEvents)
          ? [...person.memory.relationshipEvents]
          : [],
      },
    };
  }

  function recordSharedExperience(state, experience) {
    if (!state || !experience?.personId || !experience?.summary) return state;
    const persistedMemory = state.personMemories?.[experience.personId];
    if (persistedMemory && typeof persistedMemory === "object") {
      const episodes = Array.isArray(persistedMemory.episodes) ? persistedMemory.episodes : [];
      const relationshipEvents = Array.isArray(state.relationshipEvents) ? state.relationshipEvents : [];
      const exists = [...episodes, ...relationshipEvents].some((item) => (
        item?.id === experience.id
        || (item?.personId === experience.personId && cleanText(item?.summary) === cleanText(experience.summary))
      ));
      if (exists) return state;
      const episode = {
        id: experience.id,
        summary: cleanText(experience.summary),
        at: Number(experience.at) || Date.now(),
        appId: experience.appId,
        source: "natural_chat",
      };
      const relationshipEvent = {
        ...episode,
        personId: experience.personId,
        type: "shared_experience_auto",
      };
      return {
        ...state,
        personMemories: {
          ...state.personMemories,
          [experience.personId]: {
            ...persistedMemory,
            episodes: [...episodes, episode].slice(-16),
          },
        },
        relationshipEvents: [...relationshipEvents, relationshipEvent].slice(-120),
      };
    }
    const keyedPeople = state.people && !Array.isArray(state.people) && typeof state.people === "object";
    const people = keyedPeople ? state.people : (Array.isArray(state.people) ? state.people : []);
    const index = keyedPeople
      ? experience.personId
      : people.findIndex((person) => person?.id === experience.personId);
    const currentPerson = keyedPeople ? people[index] : people[index];
    if (!currentPerson) return state;
    const person = copyPerson(currentPerson);
    const existing = [
      ...person.memory.episodes,
      ...person.memory.relationshipEvents,
    ].some((item) => item?.id === experience.id || cleanText(item?.summary) === cleanText(experience.summary));
    if (existing) return state;

    const episode = {
      id: experience.id,
      summary: cleanText(experience.summary),
      at: Number(experience.at) || Date.now(),
      appId: experience.appId,
      source: "natural_chat",
    };
    const relationshipEvent = {
      ...episode,
      type: "shared_experience_auto",
    };
    person.memory.episodes = [...person.memory.episodes, episode].slice(-24);
    person.memory.relationshipEvents = [...person.memory.relationshipEvents, relationshipEvent].slice(-40);
    const nextPeople = keyedPeople ? { ...people, [index]: person } : [...people];
    if (!keyedPeople) nextPeople[index] = person;
    return { ...state, people: nextPeople };
  }

  function normalizeLegacyThread(value) {
    const status = ["waiting", "ready", "resolved", "paused", "dismissed"].includes(value?.status)
      ? value.status
      : "waiting";
    return {
      id: cleanText(value?.id, 100) || `legacy-${hashText(JSON.stringify(value || {}))}`,
      personId: cleanText(value?.personId || value?.npcId, 100),
      status,
      prompt: cleanText(value?.prompt || value?.title || value?.summary),
      summary: cleanText(value?.summary || value?.result || value?.prompt || value?.title),
      createdAt: Number(value?.createdAt || value?.at) || 0,
      updatedAt: Number(value?.updatedAt || value?.resolvedAt || value?.at) || 0,
      dismissedAt: Number(value?.dismissedAt) || 0,
    };
  }

  function dismissLegacyThread(threads, id, at = Date.now()) {
    return (Array.isArray(threads) ? threads : []).map((raw) => {
      const thread = normalizeLegacyThread(raw);
      if (thread.id !== id || !ACTIVE_LEGACY_STATUSES.has(thread.status)) return { ...raw };
      return {
        ...raw,
        status: "dismissed",
        dismissedAt: Number(at) || Date.now(),
      };
    });
  }

  function collectProfileExperiences(state, personId, legacyThreads) {
    const person = Array.isArray(state?.people)
      ? state.people.find((item) => item?.id === personId)
      : state?.people?.[personId];
    const collected = [];
    const events = [
      ...(person?.memory?.relationshipEvents || []),
      ...(Array.isArray(state?.relationshipEvents) ? state.relationshipEvents.filter((item) => item?.personId === personId) : []),
    ];
    for (const event of events) {
      if (!["shared_experience_auto", "shared_experience"].includes(event?.type)) continue;
      const summary = cleanText(event?.summary || event?.text);
      if (summary) collected.push({ id: event?.id, summary, at: Number(event?.at) || 0, source: "event" });
    }
    for (const raw of Array.isArray(legacyThreads) ? legacyThreads : []) {
      const thread = normalizeLegacyThread(raw);
      if (thread.personId !== personId || thread.status !== "resolved" || !thread.summary) continue;
      collected.push({
        id: thread.id,
        summary: thread.summary,
        at: thread.updatedAt || thread.createdAt,
        source: "legacy",
      });
    }
    const seen = new Set();
    return collected
      .sort((a, b) => b.at - a.at)
      .filter((item) => {
        const key = cleanText(item.summary).toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .slice(0, 8);
  }

  function collectCompletedExchanges(state) {
    const result = [];
    for (const appId of ["qq", "wechat"]) {
      const histories = state?.localMessages?.[appId] || {};
      const contacts = new Map();
      for (const contact of Array.isArray(state?.customContacts?.[appId]) ? state.customContacts[appId] : []) {
        if (contact?.id) contacts.set(contact.id, contact);
      }
      const peopleEntries = Array.isArray(state?.people)
        ? state.people.map((person) => [person?.id, person])
        : Object.entries(state?.people || {});
      for (const [fallbackPersonId, person] of peopleEntries) {
        const account = person?.accounts?.[appId];
        const accountId = cleanText(account?.id || (typeof account === "string" ? account : ""), 100);
        if (!accountId || contacts.has(accountId) || !Array.isArray(histories[accountId])) continue;
        contacts.set(accountId, {
          id: accountId,
          personId: cleanText(person?.id || fallbackPersonId, 100),
          name: cleanText(person?.name || account?.name, 40),
          kind: "direct",
        });
      }
      for (const [contactId, history] of Object.entries(histories)) {
        if (contacts.has(contactId) || !Array.isArray(history)) continue;
        const canonicalPersonId = `person:${appId}:${contactId}`;
        if (!state?.personMemories?.[canonicalPersonId]) continue;
        const namedReply = history.find((message) => message?.side === "them" && cleanText(message?.name, 40));
        contacts.set(contactId, {
          id: contactId,
          personId: canonicalPersonId,
          name: cleanText(namedReply?.name, 40) || "对方",
          kind: "direct",
        });
      }
      for (const contact of contacts.values()) {
        if (!contact?.id || contact?.kind === "group" || !contact?.personId) continue;
        const messages = Array.isArray(histories[contact.id]) ? histories[contact.id] : [];
        for (let index = 0; index < messages.length; index += 1) {
          const mine = messages[index];
          if (mine?.side !== "me" || !cleanText(mine?.text)) continue;
          let reply = null;
          for (let cursor = index + 1; cursor < messages.length; cursor += 1) {
            const candidate = messages[cursor];
            if (candidate?.side === "me") break;
            if (candidate?.side === "them" && cleanText(candidate?.text)) {
              reply = candidate;
              break;
            }
          }
          if (!reply) continue;
          result.push({
            appId,
            contactId: contact.id,
            personId: contact.personId,
            personName: cleanText(contact.name, 40) || "对方",
            userText: cleanText(mine.text),
            npcText: cleanText(reply.text),
            contextBefore: cleanText(messages.slice(0, index).reverse().find((message) => message?.side === "them")?.text),
            at: Number(mine.createdAt || mine.at) || index + 1,
            userMessageId: cleanText(mine.id, 100),
            npcMessageId: cleanText(reply.id, 100),
          });
        }
      }
    }
    return result;
  }

  const domain = Object.freeze({
    recognizeSharedExperience,
    recordSharedExperience,
    normalizeLegacyThread,
    dismissLegacyThread,
    collectProfileExperiences,
    collectCompletedExchanges,
    exchangeFingerprint,
  });
  globalObject.__PHONE_SIM_V083_DOMAIN__ = domain;
  if (!globalObject.document) return;

  const documentObject = globalObject.document;
  const STATE_KEY = "rphub.phoneSimulator.v2";
  const PROCESSED_KEY = "rphub.phoneSimulator.v2.v083.processedExchanges";
  const LEGACY_THREAD_KEY = "rphub.phoneSimulator.v2.v081.relationshipThreads";
  let scanTimer = 0;
  let domObserver = null;
  let processed = null;

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, (character) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[character]);
  }

  function readJson(key, fallback) {
    try {
      const value = JSON.parse(globalObject.localStorage?.getItem(key) || "null");
      return value ?? fallback;
    } catch {
      return fallback;
    }
  }

  function readLegacyThreads() {
    const value = readJson(LEGACY_THREAD_KEY, []);
    return Array.isArray(value) ? value : [];
  }

  function saveProcessed(values) {
    const bounded = [...new Set(values)].slice(-20000);
    processed = new Set(bounded);
    try {
      globalObject.localStorage?.setItem(PROCESSED_KEY, JSON.stringify(bounded));
    } catch {}
  }

  function persistState(state) {
    try {
      const sanitizer = globalObject.__PHONE_SIM_V070__?.sanitizeStateForStorage;
      const safe = typeof sanitizer === "function" ? sanitizer(state) : state;
      globalObject.localStorage?.setItem(STATE_KEY, JSON.stringify(safe));
      return true;
    } catch {
      return false;
    }
  }

  function scanNaturalExchanges() {
    const state = globalObject.__PHONE_SIM__?.getState?.();
    if (!state) return;
    const exchanges = collectCompletedExchanges(state);
    if (processed === null) {
      const stored = globalObject.localStorage?.getItem(PROCESSED_KEY);
      if (stored === null) {
        saveProcessed(exchanges.map(exchangeFingerprint));
        return;
      }
      const saved = readJson(PROCESSED_KEY, []);
      processed = new Set(Array.isArray(saved) ? saved : []);
    }

    let nextState = state;
    let changed = false;
    const nextProcessed = new Set(processed);
    for (const exchange of exchanges) {
      const fingerprint = exchangeFingerprint(exchange);
      if (nextProcessed.has(fingerprint)) continue;
      nextProcessed.add(fingerprint);
      const experience = recognizeSharedExperience(exchange);
      if (!experience) continue;
      const updated = recordSharedExperience(nextState, experience);
      if (updated !== nextState) {
        nextState = updated;
        changed = true;
      }
    }
    saveProcessed([...nextProcessed]);
    if (changed) {
      Object.assign(state, nextState);
      persistState(state);
      renderProfileExperiences(true);
    }
  }

  function formatExperienceDate(value) {
    const at = Number(value) || 0;
    if (!at) return "";
    try {

      .replace(/[<>]/g, "")

      .trim();

    return String(value || "").replace(/[^a-z0-9]/gi, "").toLowerCase();
  }

    if (!settings || typeof settings !== "object") return "";

      if (!value || typeof value !== "object" || depth > 6 || seen.has(value)) return;

    importFile(input.files?.[0]).catch((error) => setStatus(error?.message || String(error), "error")).finally(() => { input.value = ""; });
  }, true);
  const observer = new MutationObserver(() => ensureUi());
  observer.observe(document.documentElement, { childList: true, subtree: true });
  ensureUi();
})();
</script>

<script id="v087-persona-group-runtime">

    let result = 2166136261;
    for (const char of String(value)) {
      result ^= char.charCodeAt(0);
      result = Math.imul(result, 16777619);
    }
    return result >>> 0;
  };
  const personIdFor = (name, gender, salt = "") =>
    `person:v087:${hash(`${name}|${gender}|${salt}`).toString(36)}`.slice(0, 80);

  const readOverrides = () => {
    try {
      const parsed = JSON.parse(globalThis.localStorage?.getItem(OVERRIDE_KEY) || "{}");
      return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
    } catch {
      return {};
    }
  };
  const writeOverrides = overrides => {
    try { globalThis.localStorage?.setItem(OVERRIDE_KEY, JSON.stringify(overrides)); } catch {}
  };
  const persistState = current => {
    if (!current) return;
    try {
      globalThis.localStorage?.setItem(STORAGE_KEY, JSON.stringify({
        ...current,
        modelSettings: {
          ...(current.modelSettings || {}),
          apiKey: "",
          imageGenKey: ""
        }
      }));
    } catch {}
  };
  const keyFor = (appId, id) => `${text(appId, 16)}:${text(id, 100)}`;

  const buildPersonaPrompt = profile => {
    const context = [
      `你是“${text(profile.name, 24) || "未命名联系人"}”。`,
      profile.gender ? `性别：${text(profile.gender, 16)}。` : "",
      profile.appearance ? `固定外貌：${text(profile.appearance, 300)}。` : "",
      profile.persona ? `人物设定：${text(profile.persona, 1200)}。` : "",
      profile.source ? `认识来源：${text(profile.source, 120)}。` : "",
      profile.basePrompt ? `原有背景：${text(profile.basePrompt, 500)}。` : "",
      "后续聊天、主动消息、朋友圈和自拍生图都必须持续遵循上述姓名、性别、外貌与人物设定。不要擅自改名、换脸或把玩家写进人物设定。像真人一样有自己的节奏、边界和生活。"
    ].filter(Boolean);

    if (!candidate || typeof candidate !== "object") return candidate;
    candidateRegistry.set(keyFor(appId, candidate.id), { ...candidate });
    const override = readOverrides()[keyFor(appId, candidate.id)];
    if (!override) return candidate;
    const merged = {
      ...candidate,
      ...override,
      id: candidate.id,
      kind: candidate.kind,
      avatar: text(override.name || candidate.name, 1) || candidate.avatar,
      personId: candidate.personId || override.personId || personIdFor(override.name || candidate.name, override.gender || candidate.gender, candidate.id),
      basePrompt: text(candidate.basePrompt || candidate.prompt, 500)
    };
    merged.prompt = buildPersonaPrompt(merged);
    return merged;
  };

  const inferMemberCount = description => {
    const source = text(description, 160);
    const digits = source.match(/(\d{1,2})\s*(?:个)?人/);
    if (digits) return Math.max(2, Math.min(30, Number(digits[1])));
    if (/二十几|二十多/.test(source)) return 24;
    if (/十几|十来|十多/.test(source)) return 12;

      ["三十", 30], ["二十五", 25], ["二十", 20], ["十八", 18], ["十六", 16],
      ["十五", 15], ["十四", 14], ["十三", 13], ["十二", 12], ["十一", 11], ["十", 10]
    ].find(([word]) => source.includes(`${word}人`));
    return exact?.[1] || 0;
  };

    const seed = hash(`${groupId}|${index}`);

    usedNames.add(name);
    const gender = seed % 9 === 0 ? "其他" : seed % 2 === 0 ? "女" : "男";
    const appearanceList = looks[gender] || looks.其他;
    const appearance = appearanceList[(seed >>> 3) % appearanceList.length];
    const persona = personas[(seed >>> 6) % personas.length];

      id: `group-member-${hash(`${groupId}|${name}`).toString(36)}`,
      personId: personIdFor(name, gender, groupId),
      name,
      kind: "direct",
      avatar: name.slice(0, 1),
      gender,
      appearance,
      persona,
      description: persona,
      source: "群聊创建时加入的成员",
      socialBoundary: seed % 3 === 0 ? "谨慎" : seed % 4 === 0 ? "开放" : "普通",
      replyHabit: seed % 3 === 0 ? "慢" : seed % 3 === 1 ? "普通" : "快",
      activityStatus: seed % 4 === 0 ? "偶尔潜水" : "最近在群里出现过",

    };

    return member;
  };

    const profiles = selectedContacts.map(contact => ({
      id: text(contact.id, 100),
      personId: text(contact.personId, 80) || personIdFor(contact.name, contact.gender, contact.id),
      name: text(contact.name, 18),
      kind: "direct",
      avatar: text(contact.avatar || contact.name?.slice(0, 1), 2),
      gender: text(contact.gender, 16),
      appearance: text(contact.appearance, 300),
      persona: text(contact.persona || contact.description, 1200),
      description: text(contact.description, 300),
      source: text(contact.source || "已选择的好友", 120),
      socialBoundary: text(contact.socialBoundary || "普通", 16),
      replyHabit: text(contact.replyHabit || "普通", 16),
      activityStatus: text(contact.activityStatus || "正常上线", 40),
      relationshipPosture: text(contact.relationshipPosture || "好友", 120),
      temporary: false,
      prompt: text(contact.prompt, 1800)
    }));

      profiles.push(createGeneratedMember(id, profiles.length, usedNames));
    }
    const roster = profiles.map(profile => `${profile.name}（${profile.gender || "未设置"}）：${profile.persona || profile.description || "普通群成员"}`);
    const groupDescription = text(description, 160) || `${text(type, 24) || "朋友群"} · ${profiles.length} 位成员`;
    return {
      id: text(id, 100),
      name: text(name, 18),
      kind: "group",
      avatar: text(name, 1),
      description: groupDescription,
      groupPurpose: groupDescription,
      groupTopics: groupDescription,
      chatStyle: "短句为主，允许接梗、复读、插话和偶尔跑题；不同成员保留各自口癖。",
      exampleDialogue: "",
      members: profiles.map(profile => profile.name).slice(0, 30),
      memberPersonIds: profiles.map(profile => profile.personId).slice(0, 30),
      memberProfiles: profiles.slice(0, 30),
      prompt: [
        `这是“${text(name, 18)}”群聊，类型是${text(type, 24) || "朋友群"}，实际共有${profiles.length}位成员。`,
        groupDescription,
        "只允许下列群成员发言；每个人保持自己的性格、性别与说话习惯，不要让所有人同时刷屏：",

      ...profile,

        <form class="v087-editor-form" data-v087-persona-form>
          <input type="hidden" name="mode" value="${escapeHtml(draft.mode)}">
          <input type="hidden" name="appId" value="${escapeHtml(draft.appId)}">
          <input type="hidden" name="targetId" value="${escapeHtml(draft.id)}">
          <label>姓名<input name="name" maxlength="24" required value="${escapeHtml(draft.name)}" placeholder="人物显示名称"></label>
          <label>性别<input name="gender" maxlength="16" value="${escapeHtml(draft.gender)}" placeholder="女、男、非二元或自定义"></label>
          <label>固定外貌<textarea name="appearance" maxlength="300" required placeholder="发型、眼睛、体型、常见穿搭、辨识特征">${escapeHtml(draft.appearance)}</textarea></label>
          <label>人物设定<textarea name="persona" maxlength="1200" required placeholder="身份、性格、兴趣、说话习惯、生活节奏、边界和与玩家的初始关系">${escapeHtml(draft.persona)}</textarea></label>
          <p class="v087-editor-tip">这里是人物的稳定底稿。AI 会在每次聊天和生图时重新读取；修改不会删除已有聊天或关系记忆。</p>
          <p class="v087-save-status" role="status"></p>
          <div class="v087-editor-actions"><button type="button" data-action="v087-cancel-editor">取消</button><button type="submit">保存并立即应用</button></div>

    documentObject.getElementById("phoneRoot")?.append(sheet);
    sheet.querySelector('[name="name"]')?.focus?.({ preventScroll: true });
  };

    const overrides = readOverrides();

        application?.appId === draft.appId && application?.candidate?.id === draft.id

      ...(current.people[profile.personId] || {}),

      personId: profile.personId,
      name: profile.name,
      gender: profile.gender,
      appearance: profile.appearance,
      persona: profile.persona,
      description: profile.description,
      prompt: profile.prompt,
      updatedAt: Date.now()
    };

    for (const platform of ["qq", "wechat"]) {
      current.customContacts[platform] = (current.customContacts[platform] || []).map(contact => {
        if (contact?.kind !== "group" || !Array.isArray(contact.memberProfiles)) return contact;
        const memberIndex = contact.memberProfiles.findIndex(member =>
          member?.personId === profile.personId || (member?.name === old.name && old.name)
        );
        if (memberIndex < 0) return contact;

        memberProfiles[memberIndex] = { ...memberProfiles[memberIndex], ...profile };
        const members = (contact.members || []).map(name => name === previousName ? profile.name : name);
        return { ...contact, memberProfiles, members };
      });
    }
    persistState(current);
  };

    const sheet = form.closest("#v087PersonaEditor");

      gender: text(form.elements.gender?.value, 16),
      appearance: text(form.elements.appearance?.value, 300),
      persona: text(form.elements.persona?.value, 1200)
    };
    if (!values.name || !values.appearance || !values.persona) return;
    if (draft.mode === "candidate") saveCandidate(draft, values);
    else saveContact(draft, values);
    const status = form.querySelector(".v087-save-status");
    if (status) status.textContent = "已保存。后续 AI 行为与生图将立即使用新设定。";
    setTimeout(() => {
      closeEditor();
      const profileCard = documentObject.querySelector("#v072ProfileSheet .v072-profile-card");
      if (draft.mode === "contact" && profileCard) {
        const heading = profileCard.querySelector("h2");
        if (heading) heading.textContent = values.name;
        const dd = profileCard.querySelectorAll("dl dd");
        if (dd[0]) dd[0].textContent = values.gender || "未设置";
        if (dd[1]) dd[1].textContent = values.appearance;
        if (dd[2]) dd[2].textContent = values.persona.slice(0, 160);
      }
      const candidateCard = documentObject.querySelector(".candidate-profile");
      if (draft.mode === "candidate" && candidateCard) {
        const avatar = candidateCard.querySelector("header .avatar");
        const heading = candidateCard.querySelector("header h2");
        const summary = candidateCard.querySelector("header p");
        const dd = candidateCard.querySelectorAll("dl dd");
        if (avatar) avatar.textContent = values.name.slice(0, 1);
        if (heading) heading.textContent = values.name;
        if (summary) summary.textContent = values.persona.slice(0, 160);
        if (dd[0]) dd[0].textContent = values.gender || "未设置";
        if (dd[1]) dd[1].textContent = values.appearance;
      }
      const chatTitle = documentObject.querySelector(".phone-app-screen .app-header h1");
      if (draft.mode === "contact" && chatTitle) chatTitle.textContent = values.name;
      decorate();
    }, 350);
  };

  const decorateGroupForm = form => {
    if (form.querySelector('[name="memberCount"]')) return;
    const firstFieldset = form.querySelector("fieldset");
    const label = documentObject.createElement("label");
    label.className = "v087-member-count";
    label.innerHTML = '<span>群成员总数<small>含勾选好友；不足人数会生成稳定的群成员档案</small></span><input type="number" name="memberCount" min="2" max="30" step="1" value="12" inputmode="numeric">';
    firstFieldset?.append(label);
    const description = form.querySelector('[name="description"]');
    description?.addEventListener("input", () => {
      const inferred = inferMemberCount(description.value);
      const input = form.querySelector('[name="memberCount"]');
      if (inferred && input && !input.dataset.manuallyChanged) input.value = String(inferred);
    });
    form.querySelector('[name="memberCount"]')?.addEventListener("input", event => {
      event.currentTarget.dataset.manuallyChanged = "true";
    });
  };

  const decorateCandidate = card => {
    if (card.querySelector(".v087-edit-button")) return;
    const scope = card.closest(".phone-app--qq,.phone-app--wechat");
    const appId = scope?.classList.contains("phone-app--wechat") ? "wechat" : "qq";
    const target = card.querySelector("[data-candidate-id],[data-open-thread]");
    const candidateId = target?.dataset?.candidateId || target?.dataset?.openThread;
    const candidate = candidateRegistry.get(keyFor(appId, candidateId));
    if (!candidateId || candidate?.kind === "group") return;
    const button = documentObject.createElement("button");
    button.type = "button";
    button.className = "v087-edit-button";
    button.dataset.action = "v087-edit-candidate";
    button.dataset.appId = appId;
    button.dataset.candidateId = candidateId;
    button.textContent = "编辑姓名、外貌与人物设定";
    card.append(button);
  };

  const decorateContact = card => {
    if (card.querySelector(".v087-edit-button")) return;
    const remove = card.querySelector('[data-action="confirm-delete-contact"]');
    if (!remove?.dataset?.appId || !remove?.dataset?.contactId) return;
    const button = documentObject.createElement("button");
    button.type = "button";
    button.className = "v087-edit-button";
    button.dataset.action = "v087-edit-contact";
    button.dataset.appId = remove.dataset.appId;
    button.dataset.contactId = remove.dataset.contactId;
    button.textContent = "编辑姓名、外貌与人物设定";
    card.insertBefore(button, remove);
  };

  const decorate = () => {
    documentObject?.querySelectorAll?.("form[data-create-group]").forEach(decorateGroupForm);
    documentObject?.querySelectorAll?.(".candidate-profile").forEach(decorateCandidate);
    documentObject?.querySelectorAll?.("#v072ProfileSheet .v072-profile-card").forEach(decorateContact);
  };

  documentObject?.addEventListener?.("click", event => {
    const action = event.target.closest?.("[data-action]")?.dataset?.action;
    if (action === "v087-cancel-editor") {
      event.preventDefault();
      closeEditor();
      return;
    }
    if (action === "v087-edit-candidate") {
      event.preventDefault();
      const button = event.target.closest("[data-action]");
      openEditor(candidateDraft(button.dataset.appId, button.dataset.candidateId));
      return;
    }
    if (action === "v087-edit-contact") {
      event.preventDefault();
      const button = event.target.closest("[data-action]");
      openEditor(contactDraft(button.dataset.appId, button.dataset.contactId, button.closest(".v072-profile-card")));
    }
  }, true);

  documentObject?.addEventListener?.("submit", event => {
    const form = event.target.closest?.("[data-v087-persona-form]");
    if (!form) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    try { saveEditor(form); }
    catch (error) {
      const status = form.querySelector(".v087-save-status");
      if (status) status.textContent = error?.message || "保存失败，请稍后再试。";
    }
  }, true);

  const observer = typeof MutationObserver === "function"
    ? new MutationObserver(() => decorate())
    : null;
  if (documentObject?.documentElement) observer?.observe(documentObject.documentElement, { childList: true, subtree: true });
  decorate();

  globalThis.__PHONE_SIM_V087__ = Object.freeze({
    candidate: mergeCandidate,
    buildGroup,
    groupMember,
    inferMemberCount,
    openEditor,
    decorate
  });
})();
</script>

<script id="v088-young-chat-group-runtime">
(() => {
  "use strict";
  if (globalThis.__PHONE_SIM_V088__) return;

  const doc = globalThis.document;
  const STORAGE_KEY = "rphub.phoneSimulator.v2";
  const groups = new Map();
  const clean = (value, max = 1000) => String(value ?? "").replace(/\r/g, "").trim().slice(0, max);
  const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[char]));
  const keyFor = (appId, id) => `${clean(appId, 16)}:${clean(id, 100)}`;
  const currentState = () => globalThis.__PHONE_SIM__?.getState?.() || null;
  const persist = state => {
    if (!state) return;
    try {
      globalThis.localStorage?.setItem(STORAGE_KEY, JSON.stringify({
        ...state,
        modelSettings: { ...(state.modelSettings || {}), apiKey: "", imageGenKey: "" }
      }));
    } catch {}
  };

  const defaultStyle = "短句为主，像年轻人的即时聊天；允许接梗、复读、插话、改口和偶尔跑题。不同成员保留各自口癖，不要人人都像客服。";
  const groupView = group => ({
    groupPurpose: clean(group?.groupPurpose || group?.description || "熟人日常交流", 300),
    groupTopics: clean(group?.groupTopics || group?.description || "围绕群的主题和成员近况自然展开", 500),
    chatStyle: clean(group?.chatStyle || defaultStyle, 700),
    exampleDialogue: clean(group?.exampleDialogue, 1600)
  });

  const groupPrompt = group => {
    const profile = groupView(group);
    return [
      profile.groupPurpose ? `群用途：${profile.groupPurpose}` : "",
      profile.groupTopics ? `常聊话题：${profile.groupTopics}` : "",
      profile.chatStyle ? `群聊风格：${profile.chatStyle}` : "",
      profile.exampleDialogue ? `风格示例（只学习节奏和口吻，不要机械照抄）：\n${profile.exampleDialogue}` : "",
      group?.prompt ? `原有群设定：${clean(group.prompt, 1800)}` : ""
    ].filter(Boolean).join("\n").slice(0, 3600);
  };

  const directStyle = [
    "使用年轻人的即时聊天节奏。默认回复1到3个气泡，每行就是一个独立气泡；多数气泡只放一个短句、半句话或即时反应。",
    "可以自然使用“嗯、草、笑死、对、？、然后呢”等短回应，也可以在合适时复述对方的关键词接梗；但不要每轮机械复读。",
    "不要先复述玩家问题再完整总结，不要写成客服、书信或小作文。允许改口、停顿、只接其中一点，人物可以有自己的话题。",
    "只有解释复杂事情或重要情绪时才写长一点，并拆成2到4行。网络用语、表情、错字和标点频率必须服从人物设定，不要让所有人同一种口气。",
    "只输出消息正文；多条气泡用换行分隔，不要使用项目符号、引号或编号。"
  ].join("\n");

  const groupStyle = [
    "按真实年轻人群聊输出：选择1到4名真正相关的成员回应，每人可连续发1到3条；一行就是一个气泡，严格写成“昵称：消息”。",
    "多数气泡应是短句、半句、表情式反应或接梗。允许多人原样或近似复读形成合唱，也允许插话、引用、纠错、突然跑题和没人回答玩家的某个部分。",
    "不要为了展示成员差异而让每个人都发表完整观点。只有最懂当前话题的人才偶尔解释较长内容，且应拆成多条。",
    "同一个成员连续发言时，每一行仍重复写昵称。不要输出旁白、总结、成员列表、项目符号或规则说明。"
  ].join("\n");

  const splitLong = (value, hardLimit = 22) => {
    const source = clean(value, 900).replace(/^[•·\-]\s*/, "");
    if (!source) return [];
    const clauses = source.match(/[^。！？!?；;，,\n]+[。！？!?；;，,]?/g) || [source];
    const result = [];
    let buffer = "";
    const flush = () => {
      if (buffer.trim()) result.push(buffer.trim());
      buffer = "";
    };
    for (let clause of clauses) {
      clause = clause.trim();
      if (!clause) continue;
      if ((buffer + clause).length <= hardLimit) {
        buffer += clause;
        continue;
      }
      flush();
      while (clause.length > hardLimit + 6) {
        let cut = Math.max(
          clause.lastIndexOf("，", hardLimit),
          clause.lastIndexOf(",", hardLimit),
          clause.lastIndexOf(" ", hardLimit)
        );
        if (cut < 6) cut = hardLimit;
        result.push(clause.slice(0, cut + (/[，,]/.test(clause[cut]) ? 1 : 0)).trim());
        clause = clause.slice(cut + (/[，,]/.test(clause[cut]) ? 1 : 0)).trim();
      }
      buffer = clause;
    }
    flush();
    return result.filter(Boolean);
  };

  const parseReply = (contact, raw, pacing = "normal") => {
    const fallback = "刚刚手滑了。";
    let source = globalThis.__PHONE_SIM_V070__?.npc?.sanitizeReply?.(clean(raw, 2400), fallback) || clean(raw, 2400) || fallback;
    source = source.replace(/```(?:json)?/gi, "").replace(/```/g, "").trim();
    if (contact?.kind !== "group") {
      const escapedName = String(contact?.name || "").replace(/[\^$.*+?()[\]{}|]/g, "\\$&");
      const lines = source.split(/\n+/).map(line => line.replace(new RegExp(`^${escapedName}[：:]\\s*`), "").trim()).filter(Boolean);
      const bubbles = lines.flatMap(line => splitLong(line, 22)).slice(0, pacing === "active" ? 5 : 4);
      return (bubbles.length ? bubbles : [fallback]).map(text => ({
        side: "them", type: "text", name: contact?.name || "", text
      }));
    }
    const legal = new Set(Array.isArray(contact.members) ? contact.members.map(String) : []);
    const parsed = [];
    for (const line of source.split(/\n+/)) {
      const match = line.trim().match(/^([^：:\n]{1,18})[：:]\s*(.+)$/);
      const name = match?.[1]?.trim();
      if (!match || !legal.has(name)) continue;
      for (const text of splitLong(match[2], 24)) parsed.push({ side: "them", type: "text", name, text });
    }
    const max = pacing === "active" ? 8 : 6;
    if (parsed.length) return parsed.slice(0, max);
    const name = (contact.members || [contact.name || "群成员"])[0];
    return splitLong(source, 24).slice(0, Math.min(3, max)).map(text => ({
      side: "them", type: "text", name, text
    }));
  };

  const registerGroup = (appId, group) => {
    if (!group?.id) return;
    groups.set(keyFor(appId, group.id), { ...group, appId });
  };

  const closeEditor = () => doc?.getElementById("v088GroupEditor")?.remove();

  const openEditor = (appId, groupId) => {
    const state = currentState();
    const stored = state?.customContacts?.[appId]?.find(item => item?.id === groupId);
    const group = stored || groups.get(keyFor(appId, groupId));
    if (!group || !doc) return;
    const profile = groupView(group);
    closeEditor();
    const sheet = doc.createElement("section");
    sheet.id = "v088GroupEditor";
    sheet.className = "v088-group-sheet";
    sheet.__v088Group = { ...group, appId };
    sheet.innerHTML = `
      <div class="v088-group-card" role="dialog" aria-modal="true" aria-labelledby="v088GroupTitle">
        <header><div><h2 id="v088GroupTitle">编辑群聊资料</h2><p>这些内容会在每次群聊时交给 AI，保存后立即生效。</p></div><button type="button" class="v088-group-close" data-action="v088-close-group-editor" aria-label="关闭">×</button></header>
        <form class="v088-group-form" data-v088-group-form>
          <label>群名称<input name="name" maxlength="18" required value="${escapeHtml(group.name)}"></label>
          <label>这个群是干什么的<textarea name="groupPurpose" maxlength="300" required placeholder="例如：一起玩游戏、约饭和日常闲聊的熟人群">${escapeHtml(profile.groupPurpose)}</textarea></label>
          <label>群里主要聊什么<textarea name="groupTopics" maxlength="500" required placeholder="例如：游戏更新、组队、工作吐槽、周末去哪儿">${escapeHtml(profile.groupTopics)}</textarea></label>
          <label>群聊天的风格<textarea name="chatStyle" maxlength="700" required placeholder="例如：短句多、爱接梗；熟人互损但有分寸；技术问题由懂的人认真回答">${escapeHtml(profile.chatStyle)}</textarea></label>
          <label>示例对话<textarea name="exampleDialogue" maxlength="1600" placeholder="阿梨：笑死&#10;江迟：笑死&#10;夏眠：被发现了&#10;江迟：？">${escapeHtml(profile.exampleDialogue)}</textarea></label>
          <p class="v088-group-hint">示例只用于让 AI 学习节奏、口癖和成员互动方式，不会被当成已经发生过的聊天。成员姓名最好使用本群真实成员。</p>
          <p class="v088-group-status" role="status"></p>
          <div class="v088-group-actions"><button type="button" data-action="v088-close-group-editor">取消</button><button type="submit">保存并立即应用</button></div>
        </form>
      </div>`;
    doc.getElementById("phoneRoot")?.append(sheet);
    sheet.querySelector('[name="groupPurpose"]')?.focus?.({ preventScroll: true });
  };

  const saveGroup = form => {
    const sheet = form.closest("#v088GroupEditor");
    const base = sheet?.__v088Group;
    const state = currentState();
    if (!base || !state) throw new Error("当前群聊状态尚未加载。");
    const values = {
      name: clean(form.elements.name?.value, 18),
      groupPurpose: clean(form.elements.groupPurpose?.value, 300),
      groupTopics: clean(form.elements.groupTopics?.value, 500),
      chatStyle: clean(form.elements.chatStyle?.value, 700),
      exampleDialogue: clean(form.elements.exampleDialogue?.value, 1600)
    };
    if (!values.name || !values.groupPurpose || !values.groupTopics || !values.chatStyle) {
      throw new Error("请填写群名称、用途、话题和聊天风格。");
    }
    state.customContacts ||= { qq: [], wechat: [] };
    state.customContacts[base.appId] ||= [];
    const index = state.customContacts[base.appId].findIndex(item => item?.id === base.id);
    const old = index >= 0 ? state.customContacts[base.appId][index] : base;
    const next = {
      ...old,
      id: base.id,
      kind: "group",
      name: values.name,
      avatar: values.name.slice(0, 1),
      description: values.groupPurpose.slice(0, 160),
      ...values
    };
    if (index >= 0) state.customContacts[base.appId][index] = next;
    else state.customContacts[base.appId].push(next);
    state.customContacts[base.appId] = state.customContacts[base.appId].slice(-40);
    groups.set(keyFor(base.appId, base.id), { ...next, appId: base.appId });
    persist(state);
    const status = form.querySelector(".v088-group-status");
    if (status) status.textContent = "已保存。下一条群聊就会读取新设定。";
    setTimeout(() => {
      closeEditor();
      decorate();
      const heading = doc.querySelector(".group-info-hero h2");
      const description = doc.querySelector(".group-info-hero p");
      if (heading) heading.textContent = values.name;
      if (description) description.textContent = values.groupPurpose;
      renderProfile(doc.querySelector(".group-info-content"));
    }, 280);
  };

  const renderProfile = container => {
    if (!container?.dataset?.groupAppId || !container.dataset.groupId) return;
    const appId = container.dataset.groupAppId;
    const groupId = container.dataset.groupId;
    const state = currentState();
    const group = state?.customContacts?.[appId]?.find(item => item?.id === groupId) || groups.get(keyFor(appId, groupId));
    if (!group) return;
    const profile = groupView(group);
    const signature = JSON.stringify(profile);
    const existing = container.querySelector(".v088-group-profile");
    if (existing?.dataset?.profileSignature === signature) return;
    existing?.remove();
    const section = doc.createElement("section");
    section.className = "v088-group-profile";
    section.dataset.profileSignature = signature;
    section.innerHTML = `
      <div><strong>群用途</strong><p>${escapeHtml(profile.groupPurpose)}</p></div>
      <div><strong>常聊话题</strong><p>${escapeHtml(profile.groupTopics)}</p></div>
      <div><strong>聊天风格</strong><p>${escapeHtml(profile.chatStyle)}</p></div>
      ${profile.exampleDialogue ? `<details><summary>查看示例对话</summary><p>${escapeHtml(profile.exampleDialogue)}</p></details>` : ""}
      <button type="button" class="v088-group-edit" data-action="v088-edit-group" data-app-id="${escapeHtml(appId)}" data-group-id="${escapeHtml(groupId)}">编辑群资料与聊天风格</button>`;
    const hero = container.querySelector(".group-info-hero");
    hero?.insertAdjacentElement("afterend", section);
  };

  const decorate = () => doc?.querySelectorAll?.(".group-info-content[data-group-app-id][data-group-id]").forEach(renderProfile);

  doc?.addEventListener?.("click", event => {
    const button = event.target.closest?.("[data-action]");
    const action = button?.dataset?.action;
    if (action === "v088-edit-group") {
      event.preventDefault();
      openEditor(button.dataset.appId, button.dataset.groupId);
    } else if (action === "v088-close-group-editor") {
      event.preventDefault();
      closeEditor();
    }
  }, true);

  doc?.addEventListener?.("submit", event => {
    const form = event.target.closest?.("[data-v088-group-form]");
    if (!form) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    try { saveGroup(form); }
    catch (error) {
      const status = form.querySelector(".v088-group-status");
      if (status) status.textContent = error?.message || "保存失败，请稍后再试。";

  const hash = value => {
    let result = 2166136261;

      result = Math.imul(result, 16777619);

    for (let index = rows.length - 1; index >= 0; index--) {

    }
    return Infinity;
  };

  const memberProfile = (group, name, state = {}) => {

      .find(item => item?.kind !== "group" && clean(item?.name, 18) === name);

        name,
        gender: clean(source.gender, 16),
        appearance: clean(source.appearance, 320),
        persona: clean(source.persona || source.description || source.prompt, 800)

      name,

      persona: clean(line?.[2], 800)

  };

  const classify = text => {

    const userText = clean(event?.userText, 500);
    const members = (group.members || []).map(name => clean(name, 18)).filter(Boolean);

    const category = classify(userText);
    const cue = shareCue(userText);
    const distance = imageDistance(history);
    if (explicit && distance < 3) return null;
    if (!explicit && distance < 10) return null;

  function personIdForAccount(state, appId, accountId) {
    for (const [personId, person] of Object.entries(state.people || {})) {
      if (text(person?.accounts?.[appId]?.id, 100) === text(accountId, 100)) return personId;
    }
    const all = [...(state.customContacts?.[appId] || [])];
    const contact = all.find(item => text(item?.id, 100) === text(accountId, 100));
    return text(contact?.personId || V070.npc?.personIdFor?.(contact), 80);
  }

  function parseTimeWindow(playerText, npcText, now) {
    const source = `${playerText} ${npcText}`;
    const base = new Date(now);
    const at = (dayOffset, hour, minute = 0) => {
      const value = new Date(base);
      value.setDate(value.getDate() + dayOffset);
      value.setHours(hour, minute, 0, 0);
      return value.getTime();
    };
    let label = "近期";
    let startAt = now;
    let endAt = now + 24 * 60 * 60 * 1000;
    if (/明晚|明天晚上/.test(source)) {
      label = "明晚"; startAt = at(1, 18); endAt = at(2, 4);
    } else if (/明天下午/.test(source)) {
      label = "明天下午"; startAt = at(1, 12); endAt = at(1, 19);
    } else if (/明天/.test(source)) {
      label = "明天"; startAt = at(1, 8); endAt = at(1, 23, 59);
    } else if (/今晚|今夜|下播后|晚点/.test(source)) {
      label = /下播后/.test(source) ? "今晚下播后" : "今晚";
      startAt = Math.max(now, at(0, 18)); endAt = at(1, 4);
      if (endAt <= now) { startAt = now; endAt = now + 6 * 60 * 60 * 1000; }
    } else if (/今天下午|下午/.test(source)) {
      label = "今天下午"; startAt = Math.max(now, at(0, 12)); endAt = at(0, 19);
      if (endAt <= now) endAt = now + 3 * 60 * 60 * 1000;
    }
    const hhmm = source.match(/(?:晚上|下午|中午|凌晨|早上|上午)?\s*(\d{1,2})\s*[点時时](?:\s*(\d{1,2})\s*分?)?/);
    if (hhmm) {
      let hour = Number(hhmm[1]);
      if (/晚上|下午/.test(hhmm[0]) && hour < 12) hour += 12;
      if (/中午/.test(hhmm[0]) && hour < 11) hour += 12;
      const dayOffset = /明天|明晚/.test(source) ? 1 : 0;
      startAt = at(dayOffset, Math.min(23, hour), Number(hhmm[2]) || 0);
      endAt = startAt + 3 * 60 * 60 * 1000;
      label = `${dayOffset ? "明天" : "今天"}${String(hour).padStart(2, "0")}:${String(Number(hhmm[2]) || 0).padStart(2, "0")}`;
    }
    return { label, startAt, endAt };
  }

  function meetingContext(playerText, npcText) {
    const joined = `${playerText} ${npcText}`;
    const place = joined.match(/(?:在|去|来)(酒店|宾馆|咖啡店|咖啡馆|餐厅|酒吧|你家|我家|她家|他家|公园|商场|电影院)/)?.[1] || "约定地点";
    return text(`${parseTimeWindow(playerText, npcText, Date.now()).label}，${place}见面`, 180);
  }

  function explicitAcceptance(npcText) {
    const replies = text(npcText, 1400).split(/\n+/).map(item => item.trim()).filter(Boolean);
    let decision = 0;
    for (const reply of replies) {
      const value = ` ${reply} `;
      if (REJECT_RE.test(value)) decision = -1;
      if (ACCEPT_RE.test(value) || PRESENCE_RE.test(value)) decision = 1;
    }
    return decision === 1;
  }

  function createInvitation(state, mode, event) {
    if (!event.personId || !(INVITE_RE.test(event.playerText) || PRESENCE_RE.test(event.npcText)) || !explicitAcceptance(event.npcText)) return mode;
    if (mode.processedEvents.includes(event.eventId)) return mode;
    const duplicate = mode.invitations.some(item => item.sourceEventId === event.eventId);
    const processedEvents = [...mode.processedEvents, event.eventId].slice(-240);
    if (duplicate) return { ...mode, processedEvents };
    const profile = personProfile(state, event.personId, event.name);
    const now = stateNow(mode);
    const time = parseTimeWindow(event.playerText, event.npcText, now);
    const existingIndex = mode.invitations.findIndex(item => item.personId === event.personId && ["confirmed", "in_progress"].includes(item.status) && Number(item.startAt) < time.endAt && Number(item.endAt) > time.startAt);
    if (existingIndex >= 0) {
      const invitations = mode.invitations.map((item, index) => index === existingIndex ? { ...item, npcAcceptance: text(event.npcText, 500), sourceEventId: event.eventId } : item);
      return { ...mode, processedEvents, invitations };
    }
    const invitation = {
      id: uid("offline-invite"), personId: event.personId, personName: profile.name,
      sourceApp: event.sourceApp, sourceId: event.sourceId, sourceEventId: event.eventId,
      playerRequest: text(event.playerText, 500), npcAcceptance: text(event.npcText, 500),
      meetingContext: meetingContext(event.playerText, event.npcText), timeLabel: time.label,
      startAt: time.startAt, endAt: time.endAt, createdAt: now, status: "confirmed",
    };
    return { ...mode, processedEvents, invitations: [...mode.invitations, invitation].slice(-40) };
  }

  function scanPairs(items, isPlayer, isNpc, makeEvent) {
    const events = [];
    for (let index = 0; index < items.length; index += 1) {
      if (!isPlayer(items[index])) continue;
      const player = items[index];
      const playerText = text(player.text, 700);
      const replies = [];
      let lastReplyIndex = index;
      for (let replyIndex = index + 1; replyIndex < Math.min(items.length, index + 7); replyIndex += 1) {
        const reply = items[replyIndex];
        if (isPlayer(reply)) break;
        if (isNpc(reply)) {
          replies.push(reply);
          lastReplyIndex = replyIndex;
        }
      }
      if (!replies.length) continue;
      const npcText = replies.map(reply => text(reply.text, 700)).filter(Boolean).join("\n");
      if (!INVITE_RE.test(playerText) && !PRESENCE_RE.test(npcText)) continue;
      const lastReply = replies[replies.length - 1];
      const combinedReply = {
        ...lastReply,
        id: text(lastReply?.id || replies[0]?.id || `${index}-${lastReplyIndex}`, 100),
        text: npcText,
      };
      events.push(makeEvent(player, combinedReply, index, lastReplyIndex));
    }
    return events.filter(Boolean);
  }

  function collectEvents(state) {
    const events = [];
    for (const appId of ["qq", "wechat"]) {
      for (const [threadId, messages] of Object.entries(state.localMessages?.[appId] || {})) {
        const personId = personIdForAccount(state, appId, threadId);
        if (!personId || !Array.isArray(messages)) continue;
        events.push(...scanPairs(messages.slice(-50), item => item?.side === "me", item => item?.side === "them", (player, npc) => ({
          eventId: `${appId}:${threadId}:${text(npc.id, 100)}`, personId, name: "", sourceApp: appId, sourceId: threadId,
          playerText: text(player.text, 700), npcText: text(npc.text, 700),
        })));
      }
    }
    for (const post of state.forumPosts || []) {
      if (!post?.personId || !Array.isArray(post.comments)) continue;
      events.push(...scanPairs(post.comments.slice(-60), item => item?.author === "我", item => item?.author === post.author, (player, npc) => ({
        eventId: `forum:${post.id}:${text(npc.id, 100)}`, personId: text(post.personId, 80), name: text(post.author, 30), sourceApp: "forum", sourceId: text(post.id, 100),
        playerText: text(player.text, 700), npcText: text(npc.text, 700),
      })));
    }
    for (const room of state.liveRooms || []) {
      if (!room?.personId || !Array.isArray(room.comments)) continue;
      events.push(...scanPairs(room.comments.slice(-80), item => item?.type === "player" || item?.type === "me" || item?.author === "我", item => item?.type === "host" || item?.author === room.hostName, (player, npc) => ({
        eventId: `live:${room.id}:${text(npc.id, 100)}`, personId: text(room.personId, 80), name: text(room.hostName, 30), sourceApp: "live", sourceId: text(room.id, 100),
        playerText: text(player.text, 700), npcText: text(npc.text, 700),
      })));
    }
    return events;
  }

  function expireInvitations(state, mode) {
    const now = stateNow(mode);
    let changed = false;
    let nextState = state;
    const invitations = mode.invitations.map(item => {
      if (item.status === "confirmed" && Number(item.endAt) < now) {
        changed = true;
        const summary = `玩家没有在“${item.timeLabel || "约定时间"}”赴约，这次线下约定已经错过。`;
        nextState = V070.npc?.recordRelationshipExchange?.(nextState, { personId: item.personId, name: item.personName, appId: "offline" }, "offline", "", summary, now) || nextState;
        return { ...item, status: "missed", resolvedAt: now, resultSummary: summary };
      }
      return item;
    });
    return { state: nextState, mode: changed ? { ...mode, invitations } : mode, changed };
  }

  function scanInvitations() {
    if (busy) return;
    let state = current();
    let mode = normalizeMode(state);
    const before = JSON.stringify(mode.invitations.map(item => `${item.id}:${item.status}`));
    for (const event of collectEvents(state)) mode = createInvitation(state, mode, event);
    const expired = expireInvitations(state, mode);
    state = expired.state; mode = expired.mode;
    const after = JSON.stringify(mode.invitations.map(item => `${item.id}:${item.status}`));
    if (before !== after || state !== current()) commit(state, mode);
  }

  function completionUrl(apiUrl) {
    const base = text(apiUrl, 500).replace(/\/+$/, "");
    if (/\/chat\/completions$/i.test(base)) return base;
    if (/\/v1$/i.test(base)) return `${base}/chat/completions`;
    return `${base}/v1/chat/completions`;
  }

  function sanitizeImagePrompt(value) {
    return String(value == null ? "" : value).replace(/[<>"'&]/g, " ").replace(/\s+/g, " ").trim().slice(0, 900);
  }

  function buildImageUrl(state, prompt, retry = 0) {
    const settings = state?.modelSettings || {};
    const key = String(settings.imageGenKey || "").trim();
    const cleanPrompt = sanitizeImagePrompt(`${prompt}, all depicted people are adults age 22 or older, cinematic visual novel scene, consistent character identity, no text, no UI, no watermark`);
    if (!key || !cleanPrompt) return "";
    const base = key.toUpperCase().startsWith("STA1N") ? "https://nai.sta1n.cn" : "https://std.loliyc.com";
    const size = ({ "竖图(-1)": "-1", "横图(-2)": "-2", "正方(-3)": "-3" })[settings.imageSize] || "-1";
    const artist = "anime style, cinematic visual novel keyframe, detailed, very aesthetic, masterpiece, consistent character design, no text";
    const negative = "bad anatomy,bad hands,blurry,low quality,text,watermark,worst quality,extra fingers,chat screenshot,post layout,social media post,UI,speech bubbles,underage,child";
    const retryNumber = Math.max(0, Number(retry) || 0);
    return `${base}/generate?tag=${encodeURIComponent(cleanPrompt)}&token=${encodeURIComponent(key)}&model=nai-diffusion-4-5-full&artist=${encodeURIComponent(artist)}&size=${encodeURIComponent(size)}&steps=40&scale=6&cfg=0&sampler=k_dpmpp_2m_sde&negative=${encodeURIComponent(negative)}&nocache=${retryNumber ? 1 : 0}${retryNumber ? `&retry=${retryNumber}` : ""}&noise_schedule=karras`;
  }

  async function askModel(state, messages, temperature = 0.9) {
    const settings = state.modelSettings || {};
    const apiUrl = settings.apiUrl || settings.baseUrl || "";
    const apiKey = settings.apiKey || settings.key || "";
    const model = settings.model || settings.modelName || "";
    if (!apiUrl || !apiKey || !model) throw new Error("请先在设置中配置聊天模型。");
    const aborter = new AbortController();
    const timer = setTimeout(() => aborter.abort(), 60000);
    try {
      const response = await win.fetch(completionUrl(apiUrl), {
        method: "POST", signal: aborter.signal,
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
        body: JSON.stringify({ model, temperature, messages }),
      });
      if (!response.ok) throw new Error(`模型请求失败（${response.status}）`);
      const data = await response.json();
      return text(data?.choices?.[0]?.message?.content, 12000);
    } finally { clearTimeout(timer); }
  }

  function parseJson(raw) {
    const source = text(raw, 12000).replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "");
    try {
      const parsed = JSON.parse(source);
      if (typeof parsed === "string" && parsed !== source) return parseJson(parsed);
      if (parsed && typeof parsed === "object") return parsed;
    } catch {}
    const start = source.indexOf("{"); const end = source.lastIndexOf("}");
    if (start >= 0 && end > start) {
      try {
        const parsed = JSON.parse(source.slice(start, end + 1));
        if (typeof parsed === "string") return parseJson(parsed);
        if (parsed && typeof parsed === "object") return parsed;
      } catch {}
    }
    const proseMatch = source.match(/["']prose["']\s*:\s*"([\s\S]*?)"\s*,\s*["']elapsedMinutes["']\s*:/i);
    if (proseMatch) {
      const prose = proseMatch[1].replace(/\\n/g, "\n").replace(/\\r/g, "").replace(/\\t/g, "\t").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
      const elapsed = Number(source.match(/["']elapsedMinutes["']\s*:\s*(\d+)/i)?.[1]) || 20;
      const ended = /["']sceneEnded["']\s*:\s*true/i.test(source);
      const imageMatch = source.match(/["']imagePrompt["']\s*:\s*"([\s\S]*?)"\s*(?:,|})/i);
      const imagePrompt = imageMatch ? imageMatch[1].replace(/\\n/g, " ").replace(/\\r/g, " ").replace(/\\t/g, " ").replace(/\\"/g, '"').replace(/\\\\/g, "\\") : "";
      return { prose, elapsedMinutes: elapsed, sceneEnded: ended, imagePrompt };
    }
    return { prose: source, elapsedMinutes: 20, sceneEnded: false, imagePrompt: "" };
  }

  function buildStoryMessages(state, invitation, session, playerText, opening) {
    const profile = personProfile(state, invitation.personId, invitation.personName);
    const playerImageIdentity = text(V070.npc?.imageIdentityPrompt?.(state.playerProfile) || state.playerProfile?.imageIdentity || state.playerProfile?.appearance, 500);
    const memory = V070.npc?.identityProfile?.(state, invitation.personId)?.context || "";
    const history = (session.transcript || []).slice(-24).map(turn => ({ role: turn.role === "player" ? "user" : "assistant", content: turn.text }));
    const system = [
      "你正在主持一段成年人之间的线下角色扮演剧情。输出正常小说正文，不使用聊天气泡、消息记录或剧本标签。正文始终采用第二人称，用“你”指代玩家。",
      profile.canonicalPrompt || `角色：${profile.name}。${profile.persona}`,
      profile.appearance ? `NPC固定外貌：${profile.appearance}` : "",
      playerImageIdentity ? `玩家固定生图身份：${playerImageIdentity}` : "",
      profile.speechStyle ? `说话风格：${profile.speechStyle}` : "",
      profile.socialBoundary ? `社交边界：${profile.socialBoundary}` : "",
      `已经由双方在线上明确同意的邀约：${invitation.meetingContext}。NPC原话：${invitation.npcAcceptance}`,
      memory ? `共享关系记忆：${text(memory, 2600)}` : "",
      "叙事始终采用第二人称：只用“你”指代玩家，不使用“玩家”、玩家姓名或他/她来指代玩家；NPC可以使用姓名或第三人称。即使历史正文曾使用第三人称，本轮也必须直接切回第二人称，不要解释视角变化。",
      "只描写你能感知的环境、NPC的行动/语言/可观察反应及自然发生的外部事件。不得替你决定行动、台词、心理、感受、欲望或同意；你写的是尝试时，按情境判断NPC反应，不得自动判定成功。",
      "NPC的开放程度与线上人格连续，但开放不等于无条件同意。所有人物均为22岁以上成年人；不得引入未成年人。",
      "每次推动有限的一小段，让玩家仍有清晰行动空间。模型可以写场景呈现收尾迹象，但只有玩家点击结束才能正式结束会话。",
      "每轮都必须提供imagePrompt：用简洁英文描述与本轮正文严格一致的独立插画画面，保持NPC固定外貌；只有当正文明确让玩家出现在画面中时才加入玩家固定生图身份，不得虚构玩家未做的动作。所有人物均为22岁以上成年人；允许按实际剧情呈现成人NSFW内容，但禁止未成年人、文字、聊天界面、水印和UI。",
      "严格只输出JSON对象：{\"prose\":\"本轮第二人称正文\",\"elapsedMinutes\":20,\"sceneEnded\":false,\"imagePrompt\":\"concise English visual prompt\"}。elapsedMinutes为剧情内合理经过的分钟数，1到360；imagePrompt不得为空。",
    ].filter(Boolean).join("\n");
    const input = opening ? "你已经点击赴约。按已确认的邀约，从你与NPC刚见面的时刻开场；除了按约到场，不要替你添加其他行动、台词、心理或同意。" : playerText;
    return [{ role: "system", content: system }, ...history, { role: "user", content: input }];
  }

  function updatePersonActivity(state, personId, activityStatus) {
    if (!state.people?.[personId]) return state;
    return { ...state, people: { ...state.people, [personId]: { ...state.people[personId], activityStatus } } };
  }

  async function generateTurn(playerText, opening = false) {
    if (busy) return;
    let state = current(); let mode = normalizeMode(state);
    const session = mode.sessions.find(item => item.id === mode.activeSessionId);
    const invitation = mode.invitations.find(item => item.id === session?.invitationId);
    if (!session || !invitation) return;
    busy = true; render();
    try {
      const raw = await askModel(state, buildStoryMessages(state, invitation, session, playerText, opening));
      const result = parseJson(raw);
      const prose = text(result.prose, 8000);
      if (!prose) throw new Error("模型没有返回正文。");
      const elapsedMinutes = Math.max(1, Math.min(360, Number(result.elapsedMinutes) || 20));
      const imagePrompt = sanitizeImagePrompt(result.imagePrompt);
      const turns = opening ? [{ id: uid("turn"), role: "npc", text: prose, imagePrompt, imageRetry: 0, createdAt: Date.now() }] : [
        { id: uid("turn"), role: "player", text: text(playerText, 2400), createdAt: Date.now() },
        { id: uid("turn"), role: "npc", text: prose, imagePrompt, imageRetry: 0, createdAt: Date.now() },
      ];
      state = current(); mode = normalizeMode(state);
      const latest = mode.sessions.find(item => item.id === session.id);
      const sessions = mode.sessions.map(item => item.id === session.id ? {
        ...latest, paused: false, retryText: "", transcript: [...(latest?.transcript || []), ...turns].slice(-MAX_TRANSCRIPT),
        storyMinutes: (Number(latest?.storyMinutes) || 0) + elapsedMinutes,
        virtualNow: (Number(latest?.virtualNow) || stateNow(mode)) + elapsedMinutes * 60000,
        sceneLooksComplete: Boolean(result.sceneEnded), updatedAt: Date.now(), error: "",
      } : item);
      const virtualNow = Math.max(mode.virtualNow, (Number(latest?.virtualNow) || stateNow(mode)) + elapsedMinutes * 60000);
      commit(state, { ...mode, sessions, virtualNow });
    } catch (error) {
      state = current(); mode = normalizeMode(state);
      const sessions = mode.sessions.map(item => item.id === session.id ? { ...item, retryText: opening ? "" : text(playerText, 2400), error: text(error?.message || "生成失败", 300) } : item);
      commit(state, { ...mode, sessions });
    } finally { busy = false; render(); }
  }

  async function beginInvitation(invitationId) {
    if (busy) return;
    let state = current(); let mode = normalizeMode(state);
    if (mode.activeSessionId) return;
    const invitation = mode.invitations.find(item => item.id === invitationId && item.status === "confirmed");
    if (!invitation || Number(invitation.endAt) < stateNow(mode)) return scanInvitations();
    const profile = personProfile(state, invitation.personId, invitation.personName);
    const session = {
      id: uid("offline-session"), invitationId: invitation.id, personId: invitation.personId, personName: profile.name,
      sourceApp: invitation.sourceApp, sourceId: invitation.sourceId, startedAt: stateNow(mode), virtualNow: stateNow(mode),
      previousActivityStatus: text(state.people?.[invitation.personId]?.activityStatus, 80),
      transcript: [], storyMinutes: 0, paused: false, status: "active", error: "",
    };
    let liveRooms = state.liveRooms || [];
    if (invitation.sourceApp === "live") {
      liveRooms = liveRooms.map(room => room.id === invitation.sourceId && room.status === "live" ? {
        ...room, status: "ended", endedAt: Date.now(), energy: "已下播",
        summary: text(`${room.summary ? `${room.summary} ` : ""}主播按线上约定结束直播，准备赴约。`, 600),
        comments: [...(room.comments || []), { id: uid("live-system"), author: "系统", type: "system", text: "主播已经下播。", createdAt: Date.now() }].slice(-80),
      } : room);
    }
    state = updatePersonActivity({ ...state, liveRooms }, invitation.personId, "线下剧情中");
    mode = {
      ...mode, activeSessionId: session.id, sessions: [...mode.sessions, session].slice(-24),
      invitations: mode.invitations.map(item => item.id === invitation.id ? { ...item, status: "in_progress", sessionId: session.id, startedAt: session.startedAt } : item),
    };
    minimized = false; commit(state, mode);
    await generateTurn("", true);
  }

  async function summarizeSession(state, invitation, session) {
    const transcript = (session.transcript || []).map(turn => `${turn.role === "player" ? "玩家" : invitation.personName}：${turn.text}`).join("\n");
    if (!transcript) return `玩家与${invitation.personName}按约线下见面。`;
    try {
      const raw = await askModel(state, [
        { role: "system", content: "把线下剧情整理成一段客观事实摘要，用于角色长期共同记忆。只记录实际发生、说过、确认或拒绝的内容，不推测心理，不虚构亲密关系。控制在300字内，只输出摘要正文。" },
        { role: "user", content: text(transcript, 10000) },
      ], 0.35);
      return text(raw.replace(/^```\w*\s*|\s*```$/g, ""), 800) || text(transcript, 800);
    } catch { return text(transcript, 800); }
  }

  async function endActiveSession() {
    if (busy) return;
    let state = current(); let mode = normalizeMode(state);
    const session = mode.sessions.find(item => item.id === mode.activeSessionId);
    const invitation = mode.invitations.find(item => item.id === session?.invitationId);
    if (!session || !invitation) return;
    busy = true; render();
    const summary = await summarizeSession(state, invitation, session);
    state = current(); mode = normalizeMode(state);
    state = V070.npc?.recordRelationshipExchange?.(state, { personId: invitation.personId, name: invitation.personName, appId: "offline" }, "offline", "", `线下共同经历：${summary}`, Number(session.virtualNow) || Date.now()) || state;
    state = updatePersonActivity(state, invitation.personId, session.previousActivityStatus || "最近在线");
    const endAt = Number(session.virtualNow) || stateNow(mode);
    mode = {
      ...mode, activeSessionId: "", virtualNow: Math.max(mode.virtualNow, endAt),
      sessions: mode.sessions.map(item => item.id === session.id ? { ...item, status: "completed", paused: false, endedAt: endAt, summary, error: "" } : item),
      invitations: mode.invitations.map(item => item.id === invitation.id ? { ...item, status: "completed", resolvedAt: endAt, resultSummary: summary } : item),
    };

<script id="v140-group-repeat-runtime">(function bootstrapGroupRepeat(win) {

  const doc = win.document;

  const activeChains = new Map();
  let decorating = false;

  const text = (value, max = 300) => String(value == null ? "" : value).trim().slice(0, max);

  const normalizeRepeatText = value => text(value, 300).replace(/\s+/g, " ").trim();
  const chainKey = (appId, threadId) => `${appId}:${threadId}`;
  const messageId = prefix => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;

  function bubbleText(row) {
    const bubble = row?.querySelector?.(".message-bubble");
    if (!bubble || bubble.querySelector("img,.message-image-placeholder")) return "";
    const clone = bubble.cloneNode(true);
    clone.querySelectorAll?.(".message-reply-preview,.image-message-caption").forEach(node => node.remove());
    return normalizeRepeatText(clone.textContent);
  }

  function repeatRun(thread) {
    const rows = [...(thread?.querySelectorAll?.(".message-row:not(.message-row--system)") || [])];
    if (rows.length < 2) return null;
    const latestText = bubbleText(rows.at(-1));
    if (!latestText || latestText === "打断！") return null;
    let count = 0;
    for (let index = rows.length - 1; index >= 0; index -= 1) {
      if (bubbleText(rows[index]) !== latestText) break;
      count += 1;
    }
    return count >= 2 ? { text: latestText, count, latestRow: rows.at(-1) } : null;
  }

  function parseMembers(thread) {
    try {
      const members = JSON.parse(thread?.dataset?.repeatMembers || "[]");
      if (Array.isArray(members)) return [...new Set(members.map(name => text(name, 24)).filter(name => name && name !== "我"))];
    } catch {}
    return [...new Set([...(thread?.querySelectorAll?.(".message-sender") || [])].map(node => text(node.textContent, 24)).filter(name => name && name !== "我"))];
  }

  function appendMessage(appId, threadId, message) {
    const state = controller.getState() || {};
    const appMessages = state.localMessages?.[appId] || {};
    const threadMessages = appMessages[threadId] || [];
    const nextMessage = {
      id: messageId(message.side === "me" ? "repeat-me" : "repeat-member"),
      side: message.side === "me" ? "me" : "them",
      type: "text",
      name: text(message.name, 24),
      text: text(message.text, 300),
      createdAt: Date.now(),
      repeatGenerated: true,
    };
    controller.replaceState({
      ...state,
      localMessages: {

  }

  function continueChain(chain) {
    if (activeChains.get(chain.key) !== chain) return;
    if (chain.count >= chain.threshold) {

    }

    appendMessage(chain.appId, chain.threadId, { side: "them", name: member, text: chain.text });

  }

  function startChain(button) {
    const thread = button.closest?.(".thread[data-repeat-group='true']");

    const threadId = text(thread.dataset.threadId, 100);
    const repeatedText = text(button.dataset.repeatText, 300);
    const initialCount = Math.max(2, Number(button.dataset.repeatCount) || 2);
    const key = chainKey(appId, threadId);
    if (!appId || !threadId || !repeatedText || activeChains.has(key)) return;

      key, appId, threadId, text: repeatedText, seed,
      count: initialCount + 1,

      members: parseMembers(thread),

        }

        }

        button.type = "button";
        button.className = "group-repeat-plus";
        button.dataset.action = "group-repeat-plus";
        button.dataset.repeatText = run.text;
        button.dataset.repeatCount = String(run.count);

        button.textContent = "+1";

  }

    const button = event.target.closest?.("[data-action='group-repeat-plus']");
    if (!button) return;
    event.preventDefault();

</script>

<script id="v123-per-call-warning-script">
(function installPerCallModelWarning(windowObject) {
  "use strict";
  if (!windowObject || windowObject.__PHONE_SIM_PER_CALL_WARNING__) return;

  const documentObject = windowObject.document;
  const STORAGE_KEY = "phone-sim:v123:suppressed-per-call-models";
  const PER_CALL_PREFIX = /^\s*[\[［【]\s*次\s*[\]］】]/;
  const sessionSeen = new Set();

  let activeModel = "";

    } catch {
      return new Set();

    const suppressed = readSuppressed();

    try {
      windowObject.localStorage?.setItem(STORAGE_KEY, JSON.stringify([...suppressed].slice(-100)));
    } catch {}
  };

    if (!activeLayer) return;

    sessionSeen.add(normalized);
    closeWarning();
    previousFocus = documentObject.activeElement;

    const layer = documentObject.createElement("section");
    layer.className = "v123-model-warning";
    layer.setAttribute("role", "dialog");

(function installForumCommentDedupe(windowObject) {
  "use strict";
  if (!windowObject || windowObject.__PHONE_SIM_FORUM_DEDUPE__) return;

  const normalize = value => String(value ?? "").replace(/\s+/g, " ").trim();

  const dedupeComments = comments => {
    if (!Array.isArray(comments)) return { comments: [], removed: 0 };
    const seen = new Set();
    const next = [];
    let removed = 0;
    for (const comment of comments) {
      if (!comment || typeof comment !== "object") continue;
      const key = normalize(comment.author) + "\u0000" + normalize(comment.text);
      if (key !== "\u0000" && seen.has(key)) {
        removed += 1;
        continue;
      }
      if (key !== "\u0000") seen.add(key);
      next.push(comment);
    }
    return { comments: next, removed };
  };

  const dedupeState = state => {
    if (!state || typeof state !== "object" || !Array.isArray(state.forumPosts)) {
      return { state, removed: 0 };
    }
    let removed = 0;
    const forumPosts = state.forumPosts.map(post => {
      const result = dedupeComments(post?.comments);
      removed += result.removed;
      return result.removed ? { ...post, comments: result.comments } : post;
    });
    return { state: removed ? { ...state, forumPosts } : state, removed };
  };

  const run = () => {
    const controller = windowObject.__PHONE_SIM__;
    const state = controller?.getState?.();
    if (!state || typeof controller?.replaceState !== "function") return 0;
    const result = dedupeState(state);
    if (result.removed) controller.replaceState(result.state);
    return result.removed;
  };

  windowObject.__PHONE_SIM_FORUM_DEDUPE__ = Object.freeze({
    version: "1.2.4-forum-comment-dedupe",
    dedupeComments,
    dedupeState,
    run,
  });

})(window);

    const generic = `[系统：你刚通过好友申请。验证消息：${verification || "未填写"}] 自然发1到2条开场消息，可以问对方是谁、从哪里认识或为什么添加；不要立刻表现得很亲密。`;
    if (!intent || intent.directness !== "direct" || intent.confirmedAt || intent.deniedAt) return generic;
    const facts = intent.title || intent.category || sourceLabel(intent);
    return `[系统：你刚通过好友申请。验证消息：${verification || "未填写"}。你的来源内容是${sourceLabel(intent)}“${facts}”。] 只发1条短消息确认对方是不是从这里来的；保持原本人设，不要否认来源内容。确认后应承接原内容尺度，但本条先等待确认。`;
  }

  function acceptedContact(contact, verification = "") {
    const intent = normalizeSourceIntent(contact?.sourceIntent);
    if (!intent || intent.directness !== "direct") return contact;
    return {
      ...contact,
      sourceIntent: intent,
      relationshipPosture: `从${sourceLabel(intent)}建立联系，身份待一次确认；成人话题尺度与原来源一致，情感关系仍按互动推进。`,
      verification: clean(verification, 300),
    };
  }

  function enrichSourceEntity(kind, entity = {}) {
    return { ...entity, sourceIntent: betterIntent(entity.sourceIntent, deriveSourceIntent(kind, entity)) };
  }

  const api = Object.freeze({
    version: VERSION,
    normalizeSourceIntent,
    deriveSourceIntent,
    migrateState,
    identityContext,
    directContext,
    openingInstruction,
    acceptedContact,
    enrichSourceEntity,
    seededAdultGroups,
    mergeAdultGroups,
    activeContacts,
    removeConversation,
  });
  globalThis.__PHONE_SIM_V125__ = api;

  const controller = globalThis.__PHONE_SIM__;
  const currentState = controller?.getState?.();
  if (currentState && typeof controller?.replaceState === "function") {
    const migrated = migrateState(currentState);
    controller.replaceState(migrated);
    for (const group of activeContacts(migrated, "qq", seededAdultGroups())) globalThis.__PHONE_SIM_V088__?.registerGroup?.("qq", group);
    try {
      const cleanState = globalThis.__PHONE_SIM_V070__?.sanitizeStateForStorage?.(migrated) || migrated;
      globalThis.localStorage?.setItem(STORAGE_KEY, JSON.stringify(cleanState));
    } catch {}
  }
})();
</script>
