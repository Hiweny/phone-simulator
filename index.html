<script id="v128-contextual-expression-voice-runtime">
(() => {
  "use strict";
  if (globalThis.__PHONE_SIM_V128__) return;

  const VERSION = "1.2.8-contextual-expression-voice";
  const VOICES = Object.freeze([
    { id: "zh-CN-XiaoxiaoNeural", label: "晓晓·温柔女声", gender: "female" },
    { id: "zh-CN-XiaoyiNeural", label: "晓伊·活泼女声", gender: "female" },
    { id: "zh-CN-liaoning-XiaobeiNeural", label: "晓北·爽朗女声", gender: "female" },
    { id: "zh-CN-YunxiNeural", label: "云希·年轻男声", gender: "male" },
    { id: "zh-CN-YunjianNeural", label: "云健·有力男声", gender: "male" },
    { id: "zh-CN-YunyangNeural", label: "云扬·成熟男声", gender: "male" },
    { id: "zh-CN-YunxiaNeural", label: "云夏·少年男声", gender: "male" }
  ]);
  const VOICE_BY_ID = new Map(VOICES.map(voice => [voice.id, voice]));
  const VOICE_OVERRIDE_KEY = "rphub.phoneSimulator.v128.voiceOverrides";
  const PHASES = new Set([
    "stranger",
    "acquaintance",
    "familiar",
    "trusted",
    "close_friend",
    "romantic_interest",
    "partnered",
    "guarded",
    "distant"
  ]);
  const clean = (value, max = 1200) =>
    String(value ?? "").replace(/\s+/g, " ").trim().slice(0, max);
  const object = value =>
    value && typeof value === "object" && !Array.isArray(value) ? value : {};

  const normalizeGender = value => {
    const normalized = clean(value, 24).toLowerCase();
    if (/^(?:女|女性|女生|女人|female|woman|girl|f)$/.test(normalized)) return "female";
    if (/^(?:男|男性|男生|男人|male|man|boy|m)$/.test(normalized)) return "male";
    return "unknown";
  };

  const identityText = identity =>
    [
      identity?.persona,
      identity?.prompt,
      identity?.description,
      identity?.speechStyle,
      identity?.appearance,
      identity?.personality
    ].map(value => clean(value, 600)).filter(Boolean).join(" ");

  const loadVoiceOverrides = () => {
    try {
      const parsed = JSON.parse(
        globalThis.localStorage?.getItem?.(VOICE_OVERRIDE_KEY) || "{}"
      );
      return object(parsed);
    } catch {
      return {};
    }
  };

  const setVoiceOverride = (personKey, voiceId) => {
    const key = clean(personKey, 100);
    const id = clean(voiceId, 80);
    if (!key || !VOICE_BY_ID.has(id)) return false;
    const next = { ...loadVoiceOverrides(), [key]: id };
    try {
      globalThis.localStorage?.setItem?.(VOICE_OVERRIDE_KEY, JSON.stringify(next));
      return true;
    } catch {
      return false;
    }
  };

  const clearVoiceOverride = personKey => {
    const key = clean(personKey, 100);
    if (!key) return false;
    const next = { ...loadVoiceOverrides() };
    delete next[key];
    try {
      globalThis.localStorage?.setItem?.(VOICE_OVERRIDE_KEY, JSON.stringify(next));
      return true;
    } catch {
      return false;
    }
  };

  const listFrom = value => Array.isArray(value) ? value : [];

  const findContact = (state, appId, threadId) => {
    const controllerContact =
      globalThis.__PHONE_SIM__?.getContact?.(appId, threadId);
    if (controllerContact) return controllerContact;
    const safeState = object(state);
    const app = object(object(safeState.apps)[appId]);
    const lists = [
      app.contacts,
      object(safeState.contacts)[appId],
      safeState[`${appId}Contacts`],
      Array.isArray(safeState.contacts) ? safeState.contacts : []
    ];
    for (const list of lists) {
      const found = listFrom(list).find(item =>
        clean(item?.id || item?.threadId, 100) === clean(threadId, 100)
      );
      if (found) return found;
    }
    return null;
  };

  const findPersonByName = (state, name) => {
    const wanted = clean(name, 80);
    if (!wanted) return null;
    return Object.values(object(state?.people)).find(person =>
      clean(person?.name || person?.nickname || person?.displayName, 80) === wanted
    ) || null;
  };

  const resolveSpeakerIdentity = (
    state = {},
    appId = "",
    threadId = "",
    speakerName = ""
  ) => {
    const safeState = object(state);
    const contact = findContact(safeState, clean(appId, 24), clean(threadId, 100));
    if (!contact) {
      const byName = findPersonByName(safeState, speakerName);
      return Object.freeze({
        ...object(byName),
        appId: clean(appId, 24),
        threadId: clean(threadId, 100),
        speakerName: clean(speakerName, 80),
        personId: clean(byName?.personId || byName?.id, 100)
      });
    }

    let entity = contact;
    const wantedName = clean(speakerName, 80);
    if (wantedName) {
      const members = listFrom(contact.members);
      const memberIds = listFrom(contact.memberPersonIds);
      const member = members.find(item => {
        const source = typeof item === "string" ? { name: item } : object(item);
        return clean(
          source.name || source.nickname || source.displayName,
          80
        ) === wantedName;
      });
      if (typeof member === "string") {
        entity = object(object(safeState.people)[member]);
        if (!Object.keys(entity).length) entity = { name: member };
      } else if (member) {
        entity = member;
      } else {
        const personFromIds = memberIds
          .map(id => object(object(safeState.people)[clean(id, 100)]))
          .find(person =>
            clean(person.name || person.nickname || person.displayName, 80) === wantedName
          );
        entity = personFromIds || findPersonByName(safeState, wantedName) || contact;
      }
    }

    const personId = clean(
      entity?.personId ||
      entity?.id ||
      contact?.personId ||
      object(safeState.people)[contact?.personId]?.id,
      100
    );
    const person = object(object(safeState.people)[personId]);
    return Object.freeze({
      ...object(contact),
      ...person,
      ...object(entity),
      appId: clean(appId, 24),
      threadId: clean(threadId, 100),
      speakerName: wantedName || clean(entity?.name || contact?.name, 80),
      personId
    });
  };

  const voiceResult = (voiceId, identity, source = "automatic") => {
    const voice = VOICE_BY_ID.get(voiceId);
    if (!voice) return null;
    return Object.freeze({
      ...voice,
      voiceId: voice.id,
      source,
      personKey: clean(identity?.personId || identity?.id, 100)
    });
  };

  const resolveVoiceProfile = identity => {
    const source = object(identity);
    const gender = normalizeGender(source.gender);
    const persona = identityText(source);
    const personKey = clean(source.personId || source.id, 100);
    const overrideId = clean(loadVoiceOverrides()[personKey], 80);
    const overrideVoice = VOICE_BY_ID.get(overrideId);
    if (
      overrideVoice &&
      (gender === "unknown" || overrideVoice.gender === gender)
    ) {
      return voiceResult(overrideId, source, "override");
    }
    if (gender === "female") {
      if (/爽朗|豪爽|外向|直球|幽默|东北|大方/.test(persona)) {
        return voiceResult("zh-CN-liaoning-XiaobeiNeural", source);
      }
      if (/活泼|少女|俏皮|可爱|爱接梗|轻快/.test(persona)) {
        return voiceResult("zh-CN-XiaoyiNeural", source);
      }
      return voiceResult("zh-CN-XiaoxiaoNeural", source);
    }
    if (gender === "male") {
      if (/有力|强势|行动派|热血|运动|直接/.test(persona)) {
        return voiceResult("zh-CN-YunjianNeural", source);
      }
      if (/成熟|稳重|理性|正式|可靠|从容/.test(persona)) {
        return voiceResult("zh-CN-YunyangNeural", source);
      }
      if (/少年|软|温和|轻快|可爱|腼腆/.test(persona)) {
        return voiceResult("zh-CN-YunxiaNeural", source);
      }
      return voiceResult("zh-CN-YunxiNeural", source);
    }
    return null;
  };

  const relationshipStateFor = (state, contact) => {
    const safeState = object(state);
    const safeContact = object(contact);
    const personId = clean(safeContact.personId || safeContact.id, 100);
    const memory = object(object(safeState.personMemories)[personId]);
    return {
      ...object(memory.relationshipState),
      ...object(safeContact.relationshipState)
    };
  };

  const relationshipExpressionPolicy = (state, contact, context = {}) => {
    const relationship = relationshipStateFor(state, contact);
    const pressure = Number(relationship.boundaryPressure) || 0;
    let phase = PHASES.has(relationship.phase) ? relationship.phase : "stranger";
    if (pressure >= 78) phase = "distant";
    else if (pressure >= 45 && phase !== "distant") phase = "guarded";
    const requestedVoice = Boolean(context?.userRequestedVoice);
    const serious = Boolean(context?.serious || context?.boundary || context?.tension);
    const settings = {
      distant: ["very_rare", false, "forbidden", 0],
      guarded: ["very_rare", false, "forbidden", 0],
      stranger: ["very_rare", requestedVoice, requestedVoice ? "requested" : "forbidden", 0],
      acquaintance: ["occasional", requestedVoice, requestedVoice ? "requested" : "very_rare", 1],
      familiar: ["moderate", true, "occasional", 1],
      trusted: ["natural", true, "small", 1],
      close_friend: ["natural", true, "small", 1],
      romantic_interest: ["natural", true, "moderate", 1],
      partnered: ["natural", true, "moderate", 1]
    }[phase];
    const emojiAllowed = !serious;
    const voiceAllowed = Boolean(settings[1]) && !serious;
    return Object.freeze({
      phase,
      emoji: Object.freeze({
        allowed: emojiAllowed,
        level: emojiAllowed ? settings[0] : "forbidden",
        max: emojiAllowed ? 1 : 0
      }),
      voice: Object.freeze({
        allowed: voiceAllowed,
        level: voiceAllowed ? settings[2] : "forbidden",
        max: voiceAllowed ? 1 : 0
      }),
      proactiveSpecialMax: serious ? 0 : settings[3],
      reasons: Object.freeze([
        `relationship:${phase}`,
        serious ? "context:serious" : "context:natural"
      ])
    });
  };

  const voiceTextFrom = value => {
    const match = clean(value, 1200).match(
      /^(?:\[语音\]|\[voice\]|【语音】)\s*(.+)$/i
    );
    return clean(match?.[1], 1000);
  };

  const isEmojiOnly = value => {
    const normalized = String(value ?? "").replace(/\s+/g, "");
    return Boolean(
      normalized &&
      /^[\p{Extended_Pictographic}\uFE0F\u200D\u20E3]+$/u.test(normalized)
    );
  };

  const speakerNameOf = item => {
    const value = item?.name ?? item?.speakerName ?? item?.sender ?? "";
    return clean(
      typeof value === "string"
        ? value
        : value?.name || value?.nickname || value?.displayName,
      80
    );
  };

  const appIdForContact = contact => {
    const explicit = clean(contact?.appId || contact?.sourceAppId, 24);
    if (["qq", "wechat"].includes(explicit)) return explicit;
    const id = clean(contact?.id || contact?.threadId, 100);
    if (!id) return "";
    for (const appId of ["qq", "wechat"]) {
      const found = globalThis.__PHONE_SIM__?.getContact?.(appId, id);
      if (found) return appId;
    }
    const state = runtimeState();
    for (const appId of ["qq", "wechat"]) {
      if (findContact(state, appId, id)) return appId;
    }
    return "";
  };

  const contextForContact = (contact, overrides = {}) => {
    const state = runtimeState(overrides?.state);
    const appId = clean(overrides?.appId || appIdForContact(contact), 24);
    const threadId = clean(
      overrides?.threadId || contact?.id || contact?.threadId,
      100
    );
    const rows = listFrom(object(object(state.localMessages)[appId])[threadId]);
    const latestUser = [...rows].reverse().find(row => row?.side === "me");
    const latestUserText = clean(
      overrides?.latestUserText || latestUser?.text,
      500
    );
    const userRequestedVoice =
      overrides?.userRequestedVoice ??
      /语音|声聊|说给我听|用声音|录一段|发段声音/.test(latestUserText);
    const serious =
      overrides?.serious ??
      /边界|别这样|停止|不舒服|认真说|拒绝|不要再|请尊重/.test(latestUserText);
    return {
      ...object(overrides),
      state,
      appId,
      threadId,
      speakerName: clean(overrides?.speakerName, 80),
      latestUserText,
      userRequestedVoice: Boolean(userRequestedVoice),
      serious: Boolean(serious)
    };
  };

  const runtimeState = explicit =>
    object(explicit) && Object.keys(object(explicit)).length
      ? object(explicit)
      : object(globalThis.__PHONE_SIM__?.getState?.());

  const groupMemberIdentities = (state, contact, appId, threadId) => {
    const people = object(state?.people);
    const candidates = [];
    for (const member of listFrom(contact?.members)) {
      if (typeof member === "string") {
        const person = object(people[member]);
        candidates.push(
          Object.keys(person).length
            ? { ...person, personId: clean(person.personId || person.id || member, 100) }
            : resolveSpeakerIdentity(state, appId, threadId, member)
        );
      } else {
        const source = object(member);
        const personId = clean(source.personId || source.id, 100);
        candidates.push({ ...object(people[personId]), ...source, personId });
      }
    }
    for (const personIdValue of listFrom(contact?.memberPersonIds)) {
      const personId = clean(personIdValue, 100);
      const person = object(people[personId]);
      if (Object.keys(person).length) {
        candidates.push({ ...person, personId: clean(person.personId || person.id || personId, 100) });
      }
    }
    const seen = new Set();
    return candidates.filter(identity => {
      const key = clean(identity?.personId || identity?.id || identity?.name, 100);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  };

  const groupExpressionPolicy = (state, contact, appId, threadId, context) => {
    const identities = groupMemberIdentities(state, contact, appId, threadId);
    const policies = identities.map(identity => ({
      identity,
      policy: relationshipExpressionPolicy(state, identity, context),
      voice: resolveVoiceProfile(identity)
    }));
    const emojiAllowed = policies.some(entry => entry.policy.emoji.allowed);
    const voiceAllowed = policies.some(
      entry => entry.policy.voice.allowed && Boolean(entry.voice)
    );
    const proactiveSpecialMax = policies.some(
      entry => entry.policy.proactiveSpecialMax > 0
    ) ? 1 : 0;
    return Object.freeze({
      phase: "group_member_policy",
      emoji: Object.freeze({
        allowed: emojiAllowed,
        level: emojiAllowed ? "per_member" : "forbidden",
        max: emojiAllowed ? 1 : 0
      }),
      voice: Object.freeze({
        allowed: voiceAllowed,
        level: voiceAllowed ? "per_member" : "forbidden",
        max: voiceAllowed ? 1 : 0
      }),
      proactiveSpecialMax,
      reasons: Object.freeze([
        "relationship:per_group_member",
        `eligible_members:${policies.length}`
      ])
    });
  };

  const policyFor = (
    appId = "",
    threadId = "",
    speakerName = "",
    context = {}
  ) => {
    const state = runtimeState(context?.state);
    const identity = resolveSpeakerIdentity(
      state,
      clean(appId, 24),
      clean(threadId, 100),
      clean(speakerName, 80)
    );
    if (identity?.kind === "group" && !clean(speakerName, 80)) {
      return groupExpressionPolicy(
        state,
        identity,
        clean(appId, 24),
        clean(threadId, 100),
        context
      );
    }
    return relationshipExpressionPolicy(state, identity, context);
  };

  const normalizeExpressiveReply = (messages, options = {}) => {
    const rows = Array.isArray(messages) ? messages : [];
    const state = runtimeState(options?.state);
    const appId = clean(options?.appId, 24);
    const threadId = clean(
      options?.threadId || options?.targetId || options?.id,
      100
    );
    const proactive = Boolean(options?.proactive);
    let emojiSeen = false;
    let voiceSeen = false;
    let proactiveSpecialSeen = false;
    const normalized = [];

    for (const sourceItem of rows) {
      const item = object(sourceItem);
      const text = clean(item.text, 1000);
      if (!text) continue;
      const speakerName = speakerNameOf(item) || clean(options?.speakerName, 80);
      const identity = resolveSpeakerIdentity(
        state,
        appId,
        threadId,
        speakerName
      );
      const policy = relationshipExpressionPolicy(state, identity, options);
      const spokenText = voiceTextFrom(text);

      if (spokenText) {
        const profile = resolveVoiceProfile(identity);
        const proactiveAllowed =
          !proactive ||
          (!proactiveSpecialSeen && policy.proactiveSpecialMax > 0);
        if (
          policy.voice.allowed &&
          profile &&
          !voiceSeen &&
          proactiveAllowed
        ) {
          voiceSeen = true;
          if (proactive) proactiveSpecialSeen = true;
          normalized.push({
            ...item,
            text: `[语音] ${spokenText}`,
            v128PersonKey: profile.personKey,
            v128VoiceId: profile.voiceId,
            v128VoiceSource: profile.source
          });
        } else {
          normalized.push({ ...item, text: spokenText });
        }
        continue;
      }

      if (isEmojiOnly(text)) {
        const proactiveAllowed =
          !proactive ||
          (!proactiveSpecialSeen && policy.proactiveSpecialMax > 0);
        if (policy.emoji.allowed && !emojiSeen && proactiveAllowed) {
          emojiSeen = true;
          if (proactive) proactiveSpecialSeen = true;
          normalized.push({ ...item, text });
        }
        continue;
      }

      normalized.push({ ...item, text });
    }
    return normalized;
  };

  const normalizeProactiveMessages = (messages, candidate = {}) =>
    normalizeExpressiveReply(messages, {
      ...object(candidate),
      appId: clean(candidate?.appId || candidate?.source, 24),
      threadId: clean(
        candidate?.threadId ||
        candidate?.targetId ||
        candidate?.contactId ||
        candidate?.id,
        100
      ),
      speakerName: clean(candidate?.speakerName || candidate?.memberName, 80),
      proactive: true,
      userRequestedVoice: false
    });

  const expressionPrompt = (
    appId = "",
    threadId = "",
    speakerName = "",
    context = {}
  ) => {
    const state = runtimeState(context?.state);
    const identity = resolveSpeakerIdentity(
      state,
      clean(appId, 24),
      clean(threadId, 100),
      clean(speakerName, 80)
    );
    const policy = policyFor(appId, threadId, speakerName, { ...object(context), state });
    const groupMode = policy.phase === "group_member_policy";
    const personality = groupMode
      ? "per-member personalities and relationship stages"
      : identityText(identity).slice(0, 180) || "unspecified";
    const emojiRule = policy.emoji.allowed
      ? `${policy.emoji.level}, max ${policy.emoji.max}`
      : "forbidden";
    const voiceRule = policy.voice.allowed && (groupMode || resolveVoiceProfile(identity))
      ? groupMode
        ? "per_member, max 1"
        : `${policy.voice.level}, max ${policy.voice.max}`
      : "forbidden";
    return [
      "v128ExpressionContext:",
      `relationship=${policy.phase};`,
      `personality=${personality};`,
      `emoji=${emojiRule};`,
      `voice=${voiceRule};`,
      "AI decides from the immediate context and may use no special expression.",
      "Use one standalone Unicode emoji line or one [语音]spoken-text line only when natural.",
      context?.proactive
        ? `Proactive messages may use at most ${policy.proactiveSpecialMax} special expression type.`
        : "A normal turn may contain at most one standalone emoji and one voice line."
    ].join(" ");
  };

  const requestSpeech = async ({
    endpoint,
    bearer,
    text,
    voiceId,
    signal,
    fetchImpl = globalThis.fetch
  } = {}) => {
    const url = clean(endpoint, 500);
    const token = clean(bearer, 500);
    const input = clean(text, 1200);
    const voice = clean(voiceId, 80);
    if (!url || !input || !VOICE_BY_ID.has(voice)) {
      throw new Error("TTS request is missing a valid endpoint, text, or voice");
    }
    if (typeof fetchImpl !== "function") {
      throw new Error("TTS fetch is unavailable");
    }

    for (let attempt = 0; attempt < 2; attempt += 1) {
      const response = await fetchImpl(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          model: "tts-1",
          voice,
          input,
          response_format: "mp3",
          speed: 1.0
        }),
        signal
      });
      const blob = response?.ok ? await response.blob() : null;
      if (response?.ok && blob && Number(blob.size) >= 1000) return blob;
      const status = Number(response?.status) || 0;
      const retryable =
        [500, 502, 503].includes(status) ||
        (Boolean(response?.ok) && (!blob || Number(blob.size) < 1000));
      if (!retryable || attempt === 1) {
        throw new Error(
          response?.ok
            ? "TTS returned incomplete audio"
            : `TTS service unavailable (${status || "network"})`
        );
      }
    }
    throw new Error("TTS service unavailable");
  };

  globalThis.__PHONE_SIM_V128__ = Object.freeze({
    version: VERSION,
    voices: VOICES.map(voice => Object.freeze({ ...voice })),
    clearVoiceOverride,
    contextForContact,
    expressionPrompt,
    isEmojiOnly,
    normalizeGender,
    normalizeExpressiveReply,
    normalizeProactiveMessages,
    policyFor,
    requestSpeech,
    relationshipExpressionPolicy,
    resolveSpeakerIdentity,
    setVoiceOverride,
    resolveVoiceProfile,
    voiceTextFrom
  });
})();
</script>

  const voices = Object.freeze([

    { id: "zh-CN-liaoning-XiaobeiNeural", label: "晓北·爽朗女声" },
    { id: "zh-CN-YunxiaNeural", label: "云夏·少年男声" },
    { id: "zh-CN-YunxiNeural", label: "云希·年轻男声" },
    { id: "zh-CN-YunjianNeural", label: "云健·有力男声" },

    activeVoiceText: "",

    requestId: 0,
    aborter: null,
    longPressTimer: 0,
    longPressBubble: null,

  const clean = (value, max = 1200) =>
    String(value ?? "").replace(/\s+/g, " ").trim().slice(0, max);

  const isEmojiOnly = value => {
    const source = clean(value, 40);
    if (!source || source.length > 32) return false;
    try {
      const hasPictograph = /\p{Extended_Pictographic}/u.test(source);
      const rest = source
        .replace(/\p{Extended_Pictographic}/gu, "")
        .replace(/[\uFE0E\uFE0F\u200D\u20E3\u{1F3FB}-\u{1F3FF}]/gu, "")
        .trim();
      return hasPictograph && !rest;

    }

      return value == null ? fallback : value;

    }
  };

  const storeValue = (key, value) => {

  const V128 = globalThis.__PHONE_SIM_V128__;

  const voiceIdentityFor = row => {

    const identity = V128?.resolveSpeakerIdentity?.(
      state,
      appId,
      threadId,
      speakerName
    ) || {};
    const profile = V128?.resolveVoiceProfile?.(identity) || null;
    return { identity, profile };
  };

  const assignVoiceIdentity = (row, bubble) => {
    const { identity, profile } = voiceIdentityFor(row);
    const personKey = clean(identity?.personId || identity?.id, 100);
    const gender = V128?.normalizeGender?.(identity?.gender) || "unknown";
    if (personKey) bubble.dataset.v128PersonKey = personKey;
    else delete bubble.dataset.v128PersonKey;
    bubble.dataset.v128Gender = gender;
    if (profile?.voiceId && voiceIds.has(profile.voiceId)) {
      bubble.dataset.v128VoiceId = profile.voiceId;
      bubble.dataset.v128VoiceSource = profile.source || "automatic";
    } else {
      delete bubble.dataset.v128VoiceId;
      delete bubble.dataset.v128VoiceSource;
    }

  const currentVoice = bubble => {

    return voiceIds.has(selected) ? selected : "";
  };

  const recentEmoji = () => {
    try {
      const parsed = JSON.parse(readStored(RECENT_KEY, "[]"));
      const values = Array.isArray(parsed) ? parsed.filter(item => allEmoji.has(item)) : [];
      return [...new Set(values)].slice(0, 32);
    } catch {
      return [];

  };

  const rememberEmoji = emoji => {

    storeValue(RECENT_KEY, JSON.stringify(next));

  const routeForForm = form => {

        ...state,

          ...(state?.modelSettings || {}),

          imageGenKey: ""
        }
      };
      globalThis.localStorage?.setItem(STORAGE_KEY, JSON.stringify(safe));
    } catch {}

      button.setAttribute("aria-expanded", "false");

    tabs.setAttribute("role", "tablist");
    for (const category of Object.keys(categoryLabels)) {
      const tab = doc.createElement("button");
      tab.type = "button";

      tab.dataset.category = category;

      tabs.append(tab);
    }

    const grid = doc.createElement("div");
    grid.className = "v126-emoji-grid";
    grid.setAttribute("role", "tabpanel");
    for (const emoji of items) {

      button.type = "button";

    sheet.append(head, tabs, grid, hint);
  };

  const openEmoji = form => {
    const route = routeForForm(form);

    if (runtime.emojiOpen && runtime.emojiRoute === route) {
      closeEmoji();

    form.querySelector('[name="message"]')?.blur?.();

    const message = {

    runtime.activeVoiceText = text;

    const width = Math.max(240, menu.offsetWidth || 300);
    const height = Math.max(96, menu.offsetHeight || 104);
    const centerX = clientX || bubbleRect.left + bubbleRect.width / 2;
    const left = Math.max(
      8,
      Math.min(screenRect.width - width - 8, centerX - screenRect.left - width / 2)
    );
    let top = bubbleRect.top - screenRect.top - height - 8;
    if (top < 8) top = Math.min(screenRect.height - height - 8, bubbleRect.bottom - screenRect.top + 8);
    menu.style.left = `${Math.round(left)}px`;
    menu.style.top = `${Math.max(8, Math.round(top))}px`;
  };

    closeVoiceMenu();

  const installEmojiPrompt = () => {
    const previous = globalThis.__PHONE_SIM_V088__;
    if (!previous || previous.v127AiVoiceSupport) {
      return Boolean(previous?.v127AiVoiceSupport);
    }
    const directHint =
      "可以在语境合适时把一个真实Unicode表情（例如😂、😏、🥹）单独放成一行，作为独立表情气泡；每轮最多1个，也可以完全不发，不要写“[表情]”或emoji名称。你也可以像真实聊天一样偶尔直接发送一条AI声聊：让该行严格写成“[语音]这里是实际说出口的内容”。玩家明确要求发语音、用语音说或声聊时优先使用；每轮最多1条AI声聊，内容宜简短自然，不要把普通文字回复全都改成语音。";
    const groupHint =
      "群成员可以偶尔单独发表情：仍写成“昵称：😂”这种一行一气泡的格式；整轮最多1个独立表情，避免所有人一起刷表情。群成员也可偶尔发AI声聊，严格写成“昵称：[语音]这里是实际说出口的内容”；整轮最多1条AI声聊，玩家点按后才会生成并播放语音。";
    const wrappedParse = (contact, raw, pacing) => {
      const normalized = String(raw ?? "")
        .replace(/【语音】/gi, "[语音]")
        .replace(/\[voice\]/gi, "[语音]")
        .replace(/^(?:\[?(?:表情|emoji)\]?[：:]\s*)([\p{Extended_Pictographic}\uFE0F\u200D]+)\s*$/gimu, "$1");
      const lines = normalized
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);
      const groupLinePattern = /^([^：:\n]{1,24})[：:]\s*(.+)$/;
      const groupVoicePattern = /^([^：:\n]{1,24})[：:]\s*(?:\[语音\])\s*(.+)$/i;
      const hasGroupVoice = lines.some(line => groupVoicePattern.test(line));
      const parsed = [];
      if (hasGroupVoice) {
        for (const line of lines) {
          const groupLine = line.match(groupLinePattern);
          if (!groupLine) {
            const normalItems = previous.parseReply(contact, line, pacing);
            if (Array.isArray(normalItems)) parsed.push(...normalItems);
            continue;
          }
          const speaker = clean(groupLine[1], 24);
          const content = clean(groupLine[2], 900);
          if (!speaker || !content) continue;
          const baseItems = previous.parseReply(contact, `${speaker}：占位`, pacing);
          const base = Array.isArray(baseItems) && baseItems[0] ? baseItems[0] : {};
          const member = Array.isArray(contact?.members)
            ? contact.members.find(item => {
                const itemName =
                  typeof item === "string"
                    ? item
                    : item?.name || item?.nickname || item?.displayName || "";
                return clean(itemName, 24) === speaker;

            : null;
          const spokenText = voiceTextFrom(content);
          parsed.push({
            ...base,
            name: member || speaker,
            text: spokenText ? `[语音] ${spokenText}` : content
          });
        }
      } else {
        const normalItems = previous.parseReply(contact, normalized, pacing);
        if (Array.isArray(normalItems)) parsed.push(...normalItems);
      }
      let emojiSeen = false;
      let voiceSeen = false;
      const v128Parsed = parsed
        .map(item => {
          const text = clean(item?.text, 900);
          const voiceText = voiceTextFrom(text);
          return {
            ...item,
            text: voiceText ? `[语音] ${voiceText}` : text
          };
        })
        .filter(item => {
          if (!item.text) return false;
          if (voiceTextFrom(item.text)) {
            if (voiceSeen) return false;
            voiceSeen = true;
            return true;
          }
          if (!isEmojiOnly(item.text)) return true;
          if (emojiSeen) return false;
          emojiSeen = true;
          return true;
        });
      return V128.normalizeExpressiveReply(v128Parsed, V128.contextForContact(contact));
    };
    globalThis.__PHONE_SIM_V088__ = Object.freeze({

      groupStyle: `${previous.groupStyle || ""}\n${groupHint}`,

          v126Target.dataset.emoji,
          formForRoute(runtime.emojiRoute)
        );
      }
      return;
    }

    const v127Target = target?.closest?.("[data-v127-action]");
    const v127Action = v127Target?.dataset?.v127Action;
    if (v127Action) {
      event.preventDefault();
      event.stopImmediatePropagation();

        toggleTranscript(runtime.menuBubble);
      } else if (v127Action === "close-voice-menu") {
        closeVoiceMenu();
      }
      return;
    }

    const voiceBubble = target?.closest?.(".v127-voice-bubble");
    if (voiceBubble && !target?.closest?.(".v127-voice-transcript")) {

  // ========== STATE ==========
  function ensureState() {
    const ctrl = win.__PHONE_SIM__;
    if (!ctrl?.getState) return false;
    const state = ctrl.getState();
    if (!state) return false;
    if (!state.modelSettings) state.modelSettings = {};
    const ms = state.modelSettings;
    if (!ms.apiUrl) ms.apiUrl = FREE_API_URL;
    if (!ms.apiKey || ms.apiKey === DUMMY_KEY) ms.apiKey = DUMMY_KEY;
    if (!ms.model) ms.model = DEFAULT_MODEL;
    if (ms.temperature == null) ms.temperature = 0.85;
    ms.imageGenKey = "";
    return true;
  }
  
  // ========== FETCH OVERRIDE ==========
  const origFetch = win.fetch;
  win.fetch = function(url, options = {}) {
    let urlStr = typeof url === 'string' ? url : (url?.url || url?.href || String(url));
    const opts = { ...options };
    
    // Fix free API URL (completionUrl adds /v1/chat/completions suffix)
    if (urlStr && urlStr.includes('free-api.cnmwx.com')) {
      urlStr = FREE_API_URL;
      // Remove Authorization header for free API
      if (opts.headers) {
        const h = new Headers(opts.headers);
        h.delete('Authorization');
        h.delete('authorization');
        opts.headers = h;
      }
      
      // Convert OpenAI format to free API format
      try {
        let body = {};
        try { body = JSON.parse(opts.body || '{}'); } catch(e) {}
        
        if (body.messages && Array.isArray(body.messages)) {
          let prompt = '';
          for (const msg of body.messages) {
            const c = (msg.content || '').trim();
            if (!c) continue;
            if (msg.role === 'system') { prompt += c + '\n'; }
            else if (msg.role === 'assistant') { prompt += 'AI: ' + c + '\n'; }
            else { prompt += '用户: ' + c + '\n'; }
          }
          prompt += 'AI: ';
          opts.body = JSON.stringify({ prompt: prompt });
        }
      } catch(e) {}
      
      return origFetch(urlStr, opts).then(async (resp) => {
        if (!resp.ok) {
          const errText = await resp.text().catch(() => '');
          throw new Error('API error ' + resp.status + ': ' + errText.slice(0, 200));
        }
        const text = await resp.text();
        let clean = text.replace(/欢迎使用.*?<br\/?>/gi, '').replace(/<br\/?>/gi, '').trim();
        return new Response(JSON.stringify({
          choices: [{ message: { content: clean }, index: 0 }]

    s.open = true;
    s.innerHTML = `
      <summary><span>API 配置</span><small>独立聊天模型接口</small></summary>
      <div style="display:flex;flex-direction:column;gap:14px;padding:12px 0;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <label style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-muted);">
            接口模式
            <select name="sa-mode" style="padding:8px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--ink);font-size:14px;">
              <option value="free" ${isFree?'selected':''}>免费公益API</option>
              <option value="openai" ${!isFree?'selected':''}>OpenAI 兼容API</option>
            </select>
          </label>
        </div>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-muted);">
          API 地址
          <input name="sa-url" type="text" value="${escHtml(ms.apiUrl||FREE_API_URL)}" maxlength="500"
            style="padding:8px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--ink);font-size:14px;">
        </label>
        <label id="sa-key-label" style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-muted);${isFree?'opacity:0.4':''}">
          API Key
          <input name="sa-key" type="password" value="${escHtml((!isFree&&ms.apiKey)?ms.apiKey:'')}" maxlength="1000"
            placeholder="${isFree?'免费模式无需Key':'填入你的API Key'}"
            style="padding:8px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--ink);font-size:14px;"
            ${isFree?'disabled':''}>
        </label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-muted);">
          模型名称
          <input name="sa-model" type="text" value="${escHtml(ms.model||DEFAULT_MODEL)}" maxlength="160"
            style="padding:8px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--ink);font-size:14px;">
        </label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-muted);">
          温度: <span id="sa-temp-val">${ms.temperature||0.85}</span>
          <input name="sa-temp" type="range" min="0" max="2" step="0.05" value="${ms.temperature||0.85}"
            style="width:100%;accent-color:var(--violet);">
        </label>
        <div style="display:flex;gap:8px;">
          <button type="button" data-action="sa-save"
            style="flex:1;padding:10px;border:none;border-radius:8px;background:var(--violet);color:#fff;font-size:14px;font-weight:600;cursor:pointer;">保存 API 配置</button>
          <button type="button" data-action="sa-reset"
            style="padding:10px 16px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:transparent;color:var(--ink-muted);font-size:13px;cursor:pointer;">重置免费API</button>
        </div>
        <p style="font-size:11px;color:var(--ink-muted);margin:0;line-height:1.5;">默认免费API无需Key。切换OpenAI模式后，填入其他供应商的地址和Key即可使用。</p>
        <div data-sa-status role="status" style="font-size:12px;min-height:20px;"></div>
      </div>`;
    
    form.insertBefore(s, form.firstChild);
    
    const modeEl = s.querySelector('[name="sa-mode"]');
    const keyLabel = s.querySelector('#sa-key-label');
    const keyInput = s.querySelector('[name="sa-key"]');
    const urlInput = s.querySelector('[name="sa-url"]');
    const modelInput = s.querySelector('[name="sa-model"]');
    const tempSlider = s.querySelector('[name="sa-temp"]');
    const tempVal = s.querySelector('#sa-temp-val');
    const statusEl = s.querySelector('[data-sa-status]');
    
    tempSlider.addEventListener('input', () => { tempVal.textContent = tempSlider.value; });
    
    function updateMode() {
      const f = modeEl.value === 'free';
      keyLabel.style.opacity = f ? '0.4' : '1';
      keyInput.disabled = f;
      keyInput.placeholder = f ? '免费模式无需Key' : '填入你的API Key';
      if (f && urlInput.value !== FREE_API_URL && !urlInput.value.includes('free-api')) {
        // keep user's URL
      }
    }
    modeEl.addEventListener('change', updateMode);
    
    s.querySelector('[data-action="sa-save"]').addEventListener('click', () => {
      const ctrl = win.__PHONE_SIM__;
      if (!ctrl?.getState) return;
      const state = ctrl.getState();
      if (!state) return;
      const f = modeEl.value === 'free';
      state.modelSettings = {
        ...state.modelSettings,
        apiUrl: urlInput.value.trim() || FREE_API_URL,
        apiKey: f ? DUMMY_KEY : (keyInput.value.trim() || ''),
        model: modelInput.value.trim() || DEFAULT_MODEL,
        temperature: parseFloat(tempSlider.value) || 0.85,
        imageGenKey: ""
      };
      try {
        const c = JSON.parse(JSON.stringify(state));
        if (c.modelSettings) { c.modelSettings.apiKey = ""; c.modelSettings.imageGenKey = ""; }
        localStorage.setItem('rphub.phoneSimulator.v2', JSON.stringify(c));
      } catch(e) {}
      statusEl.textContent = '已保存';
      statusEl.style.color = '#4caf50';
      setTimeout(() => { statusEl.textContent = ''; }, 2000);
    });
    
    s.querySelector('[data-action="sa-reset"]').addEventListener('click', () => {
      modeEl.value = 'free';
      urlInput.value = FREE_API_URL;
      keyInput.value = '';
      modelInput.value = DEFAULT_MODEL;
      tempSlider.value = 0.85;
      tempVal.textContent = '0.85';
      updateMode();
    });
  }
  
  // ========== REMOVE IMAGE GEN UI ==========
  function removeImageGenUI() {
    doc.querySelectorAll('[data-action="toggle-image-prompt"]').forEach(e => e.remove());
    doc.querySelectorAll('[data-image-form]').forEach(e => e.remove());
    doc.querySelectorAll('.image-prompt-sheet').forEach(e => e.remove());
    doc.querySelectorAll('.composer-tool').forEach(e => {
      if (e.getAttribute('aria-label') === '生成图片') e.remove();
    });
  }
  
  // ========== PATCH LOCAL STORAGE ==========
  const origGetItem = Storage.prototype.getItem;
  Storage.prototype.getItem = function(key) {
    if (key === 'rp_hub_settings' || key === 'silly_tavern_settings') return null;
    return origGetItem.call(this, key);
  };
  
  // ========== PATCH INDEXEDDB ==========
  try {
    const origOpen = IDBFactory.prototype.open;
    IDBFactory.prototype.open = function(name, version) {
      if (name === 'RPHubDB') {
        return origOpen.call(this, 'RPHubDB_bypass', version);
      }
      return origOpen.call(this, name, version);
    };
  } catch(e) {}
  
  // ========== INIT ==========
  function init() {
    let a = 0;
    const t1 = setInterval(() => {
      if (ensureState() || ++a > 50) clearInterval(t1);
    }, 200);
    
    let b = 0;
    const t2 = setInterval(() => {
      injectApiSettings();
      removeImageGenUI();
      if (++b > 30) clearInterval(t2);
    }, 500);
    
    // Test model button handler
    doc.addEventListener('click', e => {
      const btn = e.target.closest?.('[data-action="test-model"]');
      if (!btn) return;
      e.preventDefault(); e.stopPropagation();
      const ctrl = win.__PHONE_SIM__;
      const state = ctrl?.getState?.();
      if (!state) return;
      btn.textContent = '测试中...'; btn.disabled = true;
      (async () => {
        try {
          const ms = state.modelSettings || {};
          const resp = await win.fetch(ms.apiUrl || FREE_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: ms.model||DEFAULT_MODEL, messages: [{role:'user',content:'回复"连接成功"'}], temperature: 0.5 })
          });
          const data = await resp.json();
          alert('连接成功: ' + (data?.choices?.[0]?.message?.content || 'OK').slice(0, 100));
        } catch(err) {
          alert('测试失败: ' + (err.message || String(err)));
        } finally { btn.textContent = '测试模型'; btn.disabled = false; }
      })();
    }, true);
    
    console.log('[Standalone V3] Ready');
  }
  
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init);
  else init();
  
  win.__STANDALONE__ = { version: '3.0.0', freeApiUrl: FREE_API_URL, presets: PRESETS };
  
  function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
})();
</script>

</body></html>
