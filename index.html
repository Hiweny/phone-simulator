    const preference = userText.match(/我(?:很|最|也)?喜欢([^，。！？\n]{1,30})/);
    if (preference) next.profileFacts = uniqueStrings([...next.profileFacts, `玩家喜欢${preference[1]}`], 12);
    const summary = [userText && `玩家：${userText}`, npcText && `对方：${npcText}`].filter(Boolean).join("；");
    if (summary) next.episodes = [...next.episodes, { summary: text(summary, 300), at: now }].slice(-16);
    const commitment = userText.match(/([^。！？\n]{0,32}(?:明天|后天|周末|下次|改天|一起|记得|别忘了|到时候)[^。！？\n]{0,50})/);
    if (commitment && !next.commitments.some(item => item.status === "open" && item.text === commitment[1])) {
      next.commitments = [...next.commitments, { text: text(commitment[1], 220), dueAt: 0, status: "open" }].slice(-8);
    }
    next.recentSummary = text(summary || next.recentSummary, 500);
    next.lastInteractionAt = now;
    return next;
  }

  const RELATIONSHIP_PROGRESS_PHASES = ["stranger", "acquaintance", "familiar", "trusted", "close_friend", "romantic_interest", "partnered"];

  function relationshipDayKey(now = Date.now()) {
    const date = new Date(Number(now) || Date.now());
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${date.getFullYear()}-${month}-${day}`;
  }

  function relationshipPhaseRank(phase = "stranger") {
    const rank = RELATIONSHIP_PROGRESS_PHASES.indexOf(phase);
    return rank < 0 ? 0 : rank;
  }

  function classifyRelationshipInteraction(event = {}) {
    const source = text(event.source, 24).toLowerCase();
    const type = text(event.type || "message", 32).toLowerCase();
    const playerText = text(event.text ?? event.userText, 360);
    const npcText = text(event.npcText, 360);
    const direct = source === "qq" || source === "wechat";
    const romantic = /(?:\u559c\u6b22\u4f60|\u8868\u767d|\u8c08\u604b\u7231|\u505a\u6211(?:\u7684)?\u5bf9\u8c61|\u6b63\u5f0f\u5728\u4e00\u8d77|\u548c\u6211\u5728\u4e00\u8d77|\u604b\u4eba|\u4ea4\u5f80)/.test(playerText);
    const pressure = /(?:\u7acb\u523b|\u9a6c\u4e0a|\u73b0\u5728\u5c31|\u5fc5\u987b|\u4e0d\u7b54\u5e94|\u4e0d\u8bb8|\u5305\u517b|\u8bc1\u660e(?:\u4f60|\u4e00\u4e0b))/.test(playerText);
    const disrespect = /(?:\u6eda\u5f00|\u6eda(?:$|[\u3002\uff01\uff0c\s])|\u70e6\u6b7b|\u5e9f\u7269|\u6076\u5fc3|\u9a97\u5b50|\u95ed\u5634)/.test(playerText);
    const respect = /(?:\u5bf9\u4e0d\u8d77|\u62b1\u6b49|\u4e0d\u52c9\u5f3a|\u5c0a\u91cd(?:\u4f60|\u4f60\u7684)?(?:\u8282\u594f|\u60f3\u6cd5|\u8fb9\u754c)|\u4f60\u8212\u670d\u6700\u91cd\u8981|\u6309\u4f60\u7684\u8282\u594f|\u6162\u6162\u6765)/.test(playerText);
    const thoughtful = /(?:\u8f9b\u82e6|\u52a0\u6cb9|\u542c\u4f60\u8bf4|\u8bb0\u5f97(?:\u4f60|\u4e4b\u524d|\u7ea6\u5b9a)|\u7b54\u5e94|\u8bf4\u5230\u505a\u5230|\u7167\u987e\u597d\u81ea\u5df1|\u9700\u8981\u5e2e\u5fd9|\u966a\u4f60)/.test(playerText);
    const promiseKept = /(?:\u8bb0\u5f97(?:\u4f60|\u4e4b\u524d|\u7ea6\u5b9a)|\u7b54\u5e94|\u8bf4\u5230\u505a\u5230|\u5151\u73b0|\u7ea6\u5b9a)/.test(playerText);
    const sharedInterest = /(?:\u4e00\u8d77|\u8fd1\u51b5|\u804a\u804a|\u4e5f\u559c\u6b22|\u540c\u6837|\u6700\u8fd1)/.test(playerText);
    const partnershipRequest = /(?:\u6b63\u5f0f\u5728\u4e00\u8d77|\u505a\u6211(?:\u7684)?\u5bf9\u8c61|\u6211\u4eec\u4ea4\u5f80|\u6210\u4e3a\u604b\u4eba)/.test(playerText);
    const clearAcceptance = partnershipRequest && /(?:\u6211(?:\u4e5f)?\u613f\u610f|\u613f\u610f(?:\u8bd5\u8bd5|\u8ba4\u771f|\u6162\u6162)?|\u6211\u4eec(?:\u8bd5\u7740|\u8ba4\u771f)?(?:\u4ea4\u5f80|\u5728\u4e00\u8d77))/.test(npcText);
    return {
      source,
      type,
      playerText,
      npcText,
      direct,
      romantic,
      pressure,
      disrespect,
      respect,
      thoughtful,
      promiseKept,
      sharedInterest,
      partnershipRequest,
      clearAcceptance,
      gift: type === "live_gift" || source === "live" && type === "gift",
    };
  }

  function relationshipFingerprint(event = {}, now = Date.now()) {
    const explicit = text(event.fingerprint, 180);
    if (explicit) return explicit;
    const source = text(event.source, 24).toLowerCase();
    const type = text(event.type || "message", 32).toLowerCase();
    const payload = `${text(event.text ?? event.userText, 180)}|${text(event.npcText, 180)}`.toLowerCase();
    return `${source}:${type}:${relationshipDayKey(now)}:${stableNumber(payload)}`;
  }

  function relationshipTargetPhase(relationship = {}, profile = {}) {
    if (relationship.boundaryPressure >= 78 || relationship.trust <= 12) return "distant";
    if (relationship.boundaryPressure >= 45 || relationship.trust <= 25) return "guarded";
    const tempo = profile.socialTempo === "slow" ? "slow" : profile.socialTempo === "active" ? "active" : "natural";
    const romanceDays = { slow: 12, natural: 9, active: 6 }[tempo];
    const attractionNeed = { slow: 38, natural: 29, active: 22 }[tempo];
    if (
      profile.romanceAvailability === "possible"
      && relationship.meaningfulDays.length >= romanceDays
      && relationship.meaningfulInteractions >= romanceDays
      && relationship.trust >= 68
      && relationship.closeness >= 58
      && relationship.familiarity >= 48
      && relationship.attraction >= attractionNeed
      && relationship.boundaryPressure <= 20
    ) return "romantic_interest";
    if (relationship.trust >= 74 && relationship.closeness >= 60 && relationship.familiarity >= 45) return "close_friend";
    if (relationship.trust >= 60 && relationship.closeness >= 46 && relationship.familiarity >= 28) return "trusted";
    if (relationship.trust >= 48 && relationship.familiarity >= 16) return "familiar";
    if (relationship.familiarity >= 10 || relationship.meaningfulInteractions > 0) return "acquaintance";
    return "stranger";
  }

  function boundedRelationshipPhase(previous = "stranger", desired = "stranger", relationship = {}) {
    if (desired === "distant" || desired === "guarded") return desired;
    if (previous === "distant") {
      return relationship.boundaryPressure <= 18 && relationship.repairProgress >= 55 ? "acquaintance" : "distant";
    }
    if (previous === "guarded") {
      return relationship.boundaryPressure <= 25 && relationship.repairProgress >= 30 ? "acquaintance" : "guarded";
    }
    if (previous === "partnered" && desired !== "distant" && desired !== "guarded") return "partnered";
    const previousRank = relationshipPhaseRank(previous);
    const desiredRank = relationshipPhaseRank(desired);
    if (desiredRank > previousRank + 1) return RELATIONSHIP_PROGRESS_PHASES[previousRank + 1];
    return desired;
  }

  function relationshipPosture(phase = "stranger", pressure = 0) {
    if (phase === "distant" || pressure >= 78) return "需要明显的距离与边界";
    if (phase === "guarded" || pressure >= 45) return "对互动保持防备";
    if (phase === "partnered") return "已确认关系，仍尊重彼此生活";
    if (phase === "romantic_interest") return "对亲密表达有自然回应";
    if (phase === "close_friend") return "相处稳定，愿意分享重要近况";
    if (phase === "trusted") return "已有稳定信任";
    if (phase === "familiar") return "正在慢慢熟悉";
    if (phase === "acquaintance") return "刚认识，彼此了解中";
    return "仍在初步认识";
  }

  function applyRelationshipEvent(memory = {}, profile = {}, event = {}, now = Date.now()) {
    const base = normalizeMemory(memory, now);
    const normalizedBase = normalizeRelationshipProfile(profile, profile?.personId);
    const normalizedProfile = {
      ...normalizedBase,
      progressMultiplier: clamp(profile?.progressMultiplier, 0.5, 1.55, normalizedBase.socialTempo === "slow" ? 0.82 : normalizedBase.socialTempo === "active" ? 1.15 : 1),
      personaPacing: text(profile?.personaPacing, 80),
    };
    const relationship = { ...base.relationshipState };
    const signals = classifyRelationshipInteraction(event);
    const fingerprint = relationshipFingerprint(event, now);
    if (fingerprint && relationship.recentFingerprints.includes(fingerprint)) return base;
    const day = relationshipDayKey(now);
    const alreadyMeaningfulToday = relationship.meaningfulDays.includes(day);
    const source = text(signals.source, 24).toLowerCase();
    const channel = ({
      qq: { familiarity: 1.8, trust: .55, closeness: .45, quality: 1 },
      wechat: { familiarity: 1.8, trust: .55, closeness: .45, quality: 1 },
      forum: { familiarity: .9, trust: .35, closeness: .28, quality: .72 },
      live: { familiarity: .8, trust: .32, closeness: .3, quality: .68 },
      offline: { familiarity: 5, trust: 3, closeness: 4, quality: 1.4 },
      group: { familiarity: .65, trust: .2, closeness: .18, quality: .42 },
      social: { familiarity: .7, trust: .24, closeness: .22, quality: .5 },
    })[source] || { familiarity: .5, trust: .18, closeness: .15, quality: .4 };
    const personality = normalizedProfile.progressMultiplier;
    const dailyMultiplier = alreadyMeaningfulToday ? .55 : 1;
    const gain = (value, includeDaily = true) => value * personality * (includeDaily ? dailyMultiplier : 1);
    const adjust = (field, value) => {
      relationship[field] = Math.round(clamp((Number(relationship[field]) || 0) + value, 0, 100, 0) * 10) / 10;
    };
    const combinedText = `${signals.playerText} ${signals.npcText}`;
    const hasTwoSidedExchange = Boolean(signals.playerText && signals.npcText) || source === "offline" && Boolean(signals.playerText || signals.npcText);
    const missedCommitment = /(?:没有.{0,8}赴约|未.{0,4}赴约|爽约|放鸽子|错过.{0,6}约定)/.test(combinedText);

    relationship.recentFingerprints = uniqueStrings([...relationship.recentFingerprints, fingerprint], 12);
    if (signals.gift) {
      adjust("familiarity", gain(1, false));
      relationship.lastChangeReason = "礼物被记录为支持，不会直接购买信任或亲密";
    } else if (missedCommitment) {
      adjust("trust", -10);
      adjust("closeness", -6);
      adjust("boundaryPressure", 12);
      relationship.repairProgress = 0;
      relationship.lastChangeReason = "没有履行约定会损伤信任";
    } else if (signals.disrespect) {
      adjust("trust", -18);
      adjust("closeness", -12);
      adjust("boundaryPressure", 36);
      relationship.repairProgress = 0;
      relationship.lastChangeReason = "越界或贬低会让对方拉开距离";
    } else if (signals.pressure) {
      adjust("trust", -12);
      adjust("closeness", -9);
      adjust("boundaryPressure", 20);
      relationship.repairProgress = 0;
      relationship.lastChangeReason = "被催促时，对方需要自己的节奏";
    } else {
      if (hasTwoSidedExchange) {
        adjust("familiarity", gain(channel.familiarity, false));
        adjust("trust", gain(channel.trust, false));
        adjust("closeness", gain(channel.closeness, false));
        relationship.lastChangeReason = `${normalizedProfile.personaPacing || "自然"}节奏下的${source || "共同"}互动正在积累关系`;
      }
      const meaningful = hasTwoSidedExchange && (signals.thoughtful || signals.sharedInterest || signals.romantic || signals.respect || source === "offline");
      if (meaningful && signals.thoughtful) {
        adjust("trust", gain(3 * channel.quality));
        adjust("closeness", gain(2 * channel.quality));
      }
      if (meaningful && signals.sharedInterest) {
        adjust("trust", gain(1.5 * channel.quality));
        adjust("closeness", gain(2 * channel.quality));
      }
      if (meaningful && normalizedProfile.trustFocus === "listening" && signals.thoughtful) adjust("trust", gain(1.5 * channel.quality));
      if (meaningful && normalizedProfile.trustFocus === "promise" && signals.promiseKept) adjust("trust", gain(2 * channel.quality));
      if (meaningful && normalizedProfile.trustFocus === "shared_interest" && signals.sharedInterest) adjust("trust", gain(1.5 * channel.quality));
      if (meaningful && signals.respect) {
        const repair = Math.max(1, 5 * (normalizedProfile.repairTolerance / 100) * personality * channel.quality);
        adjust("boundaryPressure", -repair);
        adjust("repairProgress", repair);
        adjust("trust", gain(1.5 * channel.quality));
        if (normalizedProfile.trustFocus === "space") adjust("trust", gain(1.5 * channel.quality));
        relationship.lastChangeReason = "尊重边界被慢慢感受到";
      } else if (meaningful && relationship.boundaryPressure > 0) {
        adjust("boundaryPressure", -Math.max(.5, gain(.8 * channel.quality)));
      }
      if (meaningful) {
        adjust("familiarity", gain(3.5 * channel.quality));
        relationship.meaningfulInteractions = Math.min(120, relationship.meaningfulInteractions + 1);
        if (!alreadyMeaningfulToday) relationship.meaningfulDays = uniqueStrings([...relationship.meaningfulDays, day], 24);
        if (
          normalizedProfile.romanceAvailability === "possible"
          && relationship.trust >= 48
          && relationship.closeness >= 35
          && (signals.thoughtful || signals.sharedInterest || signals.romantic || source === "offline")
        ) {
          adjust("attraction", gain((normalizedProfile.warmth >= 60 ? 2.4 : 1.7) * channel.quality));
        }
        if (!signals.respect) relationship.lastChangeReason = `${source || "共同"}中的有效共同经历增加了信任与熟悉`;
      }
    }

    const desired = relationshipTargetPhase(relationship, normalizedProfile);
    let phase = boundedRelationshipPhase(relationship.phase, desired, relationship);
    if (
      ["qq", "wechat", "forum", "live", "offline"].includes(source)
      && signals.clearAcceptance
      && relationship.phase === "romantic_interest"
      && normalizedProfile.romanceAvailability === "possible"
      && relationship.boundaryPressure <= 20
    ) {
      phase = "partnered";
      relationship.recentConsentSignal = "accepted";
      relationship.lastChangeReason = "双方明确表达愿意后确认关系";
    } else if (signals.romantic && !signals.pressure && !signals.disrespect) {
      relationship.recentConsentSignal = "interest";
    }
    if (phase !== relationship.phase) {
      relationship.lastTransitionAt = Number(now) || Date.now();
      relationship.phase = phase;
    }
    relationship.posture = relationshipPosture(relationship.phase, relationship.boundaryPressure);
    return { ...base, relationshipState: normalizeRelationshipState(relationship, now), posture: relationship.posture };
  }

  function relationshipBrief(state = {}, entity = {}, pendingText = "") {
    const personId = text(entity?.personId, 80) || contactPersonId(entity, text(entity?.appId, 16));
    const profile = relationshipProfileFor(state, personId);
    const relationship = normalizeMemory(state.personMemories?.[personId] || {}).relationshipState;
    const signals = classifyRelationshipInteraction({ source: entity?.appId || entity?.source || "", text: pendingText });
    const phaseGuidance = {
      stranger: "仍是初步认识，只适合礼貌、轻松地互相了解。",
      acquaintance: "刚认识，保持自然礼貌，不预设亲密感。",
      familiar: "正在熟悉，可以延续已知话题，但不要越过私人边界。",
      trusted: "已经有稳定信任，可以真诚分享近况，也保留各自节奏。",
      close_friend: "关系稳定亲近，仍要尊重对方独立生活与拒绝权。",
      romantic_interest: "对亲密表达有自然回应，但关系还需要双方慢慢确认。",
      partnered: "已确认关系，交流仍应像两个独立的人，不黏腻、不控制。",
      guarded: "对方近期有防备；先回应感受并明确边界，不要推进亲密话题。",
      distant: "对方需要明显距离；不应主动示爱、催促或假装关系亲密。",
    }[relationship.phase] || "保持自然、尊重的初识距离。";
    const styleGuidance = {
      direct: "边界被触碰时会说得清楚。",
      gentle: "会温和地表达不适或放慢节奏。",
      observant: "会先观察长期行动，而不是被一两句话打动。",
      avoidant: "压力大时会减少回应、拉开距离。",
    }[profile.boundaryStyle] || "会按自己的节奏回应。";
    const trustGuidance = {
      promise: "更在意说过的话有没有被认真记住和做到。",
      listening: "更在意自己的感受有没有被认真听见。",
      shared_interest: "更在意真实的共同兴趣和共同经历。",
      space: "更在意不被催促、能保有自己的空间。",
    }[profile.trustFocus] || "会从长期相处判断安全感。";
    const initiativeGuidance = profile.initiative >= 70
      ? "熟悉后会自然地主动延续话题，但不会黏人。"
      : profile.initiative <= 40
        ? "主动联系较少，沉默不等于拒绝，也不该被催促。"
        : "会按当下生活节奏决定是否主动联系。";
    const romanceGuidance = profile.romanceAvailability !== "possible"
      ? "这个角色不会把相处导向恋爱，请维持合适的朋友或陌生人边界。"
      : relationship.phase === "romantic_interest" || relationship.phase === "partnered"
        ? ({ reserved: "亲密表达克制，不要把每句话都写成情话。", direct: "可以坦诚表达在意，但仍要尊重对方说不。", practical: "会把关心落实在具体行动和安排上。", warm: "表达会温柔自然，但不牺牲独立生活。" }[profile.romanceStyle] || "亲密表达保持自然。")
        : "不要预设恋爱走向，更不要把礼物或一句表白当作承诺。";
    const pendingGuidance = signals.pressure || signals.disrespect
      ? "玩家这一轮有催促或越界信号：请清楚表达不适、放慢或拒绝，绝不能以暧昧/答应来安抚。"
      : signals.respect
        ? "玩家在表达尊重或修复；可承认感受，但不要立刻恢复到从前。"
        : "不要把礼物、单次示好或模型里出现的暧昧词当成关系升级理由。";
    return `关系生成约束：${phaseGuidance}${styleGuidance}${trustGuidance}${initiativeGuidance}${romanceGuidance}${pendingGuidance} 角色有独立生活；只有长期直接互动与双方明确同意，才可能确认恋爱关系。`.slice(0, 500);
  }

  function recordRelationshipExchange(state = {}, contact = {}, source = "", userText = "", npcText = "", now = Date.now(), options = {}) {
    const appId = text(source || contact?.appId, 16).toLowerCase();
    const personId = text(contact?.personId, 80) || contactPersonId(contact, appId);
    if (!personId) return state;
    const profile = relationshipProfileFor(state, personId);
    const base = updateMemory(state.personMemories?.[personId] || {}, { userText, npcText }, now);
    const memory = applyRelationshipEvent(base, profile, {
      source: appId,
      type: options.type || "message",
      text: userText,
      npcText,
      fingerprint: options.fingerprint,
    }, now);
    return { ...state, personMemories: { ...(state.personMemories || {}), [personId]: memory } };
  }

  function buildTimeContext(now = Date.now(), lastInteractionAt = 0) {
    const date = new Date(now);
    const dateText = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" }).format(date);
    const hour = date.getHours();
    const period = hour < 5 ? "深夜" : hour < 9 ? "早晨" : hour < 12 ? "上午" : hour < 14 ? "中午" : hour < 18 ? "下午" : hour < 23 ? "晚上" : "深夜";
    const elapsed = Math.max(0, now - Number(lastInteractionAt || 0));
    const gap = !lastInteractionAt ? "此前没有可靠的互动时间" : elapsed >= 86400000 ? `距上次互动约${Math.floor(elapsed / 86400000)}天` : elapsed >= 3600000 ? `距上次互动约${Math.floor(elapsed / 3600000)}小时` : `距上次互动约${Math.max(1, Math.floor(elapsed / 60000))}分钟`;
    return `当前本地时间：${dateText} ${period}${hour}点；${gap}。不要机械报时，只让时间自然影响语气、安排和回复长度。`;
  }

  function limitDirectReply(value, max = 360) {
    const result = text(value, 4000);
    if (result.length <= max) return result;
    const candidate = result.slice(0, max);
    const boundary = Math.max(candidate.lastIndexOf("。"), candidate.lastIndexOf("！"), candidate.lastIndexOf("？"), candidate.lastIndexOf("\n"));
    return (boundary >= Math.floor(max * 0.55) ? candidate.slice(0, boundary + 1) : candidate).trim();
  }

  function sanitizeReply(value, fallback = "") {
    const fakeMarker = /^\s*(?:[\[【(（]\s*(?:\u751f\u56fe|\u56fe\u7247|\u56fe\u50cf|\u7167\u7247)(?:\s*[:：][^\]】)）]*)?\s*[\]】)）]|(?:\u751f\u56fe|\u751f\u6210\u56fe\u7247)\s*[:：]?)(?:\s*.*)?$/i;
    const fakeFilename = /^\s*(?:[\[【(（]?\s*(?:\u56fe\u7247|\u56fe\u50cf|\u7167\u7247)\s*[:：]\s*)?[^<>:"/\\|?*\n]{1,80}\.(?:jpe?g|png|webp|gif)\s*[\]】)）]?\s*$/i;
    const cleaned = String(value ?? "")
      .replace(/\r/g, "")
      .split("\n")
      .map(line => line.trim())
      .filter(line => line && !fakeMarker.test(line) && !fakeFilename.test(line))
      .join("\n")
      .trim();
    return cleaned || text(fallback, 120);
  }

  function parseGroupReply(value, members = [], max = 3) {
    const legal = new Set(members.map(String));
    return String(value ?? "").replace(/\r/g, "").split("\n").map(line => {
      const match = line.match(/^([^：:\n]{1,18})[：:]\s*(.+)$/);
      const sender = match?.[1]?.trim();
      return match && legal.has(sender) ? { sender, text: limitDirectReply(match[2], 220) } : null;
    }).filter(Boolean).slice(0, Math.max(1, Math.min(5, max)));
  }

  function buildFallbackProactive(candidate = {}, memory = {}, seed = 0) {
    const normalized = normalizeMemory(memory);
    const phase = normalized.relationshipState.phase;
    if (phase === "guarded" || phase === "distant") return [];
    const commitment = normalized.commitments.find(item => item.status === "open")?.text;
    const fact = normalized.profileFacts[Number(seed) % Math.max(1, normalized.profileFacts.length)];
    const categories = [
      [`${candidate.activityStatus || "刚忙完"}，突然想到你。`, "你有空再回就行。"],

  function v078SetText(node, value) {

  function v078SetData(node, name, value) {

    if (node.dataset[name] !== next) node.dataset[name] = next;

  function v078SetAttribute(node, name, value) {

    const connection = navigatorObject?.connection || navigatorObject?.mozConnection || navigatorObject?.webkitConnection;
    return {
      online: navigatorObject?.onLine !== false,
      effectiveType: text(connection?.effectiveType, 12),

  function v078EnsureDeviceObservers() {
    if (v078DeviceEventsBound) return;
    v078DeviceEventsBound = true;
    const refresh = () => v078RefreshRenderedStatus();
    windowObject.addEventListener?.("online", refresh);
    windowObject.addEventListener?.("offline", refresh);
    const navigatorObject = windowObject.navigator;
    const connection = navigatorObject?.connection || navigatorObject?.mozConnection || navigatorObject?.webkitConnection;
    connection?.addEventListener?.("change", refresh);
    if (typeof navigatorObject?.getBattery === "function") {
      Promise.resolve(navigatorObject.getBattery()).then(battery => {
        v078Battery = battery;
        ["levelchange", "chargingchange"].forEach(eventName => battery?.addEventListener?.(eventName, refresh));
        refresh();
      }).catch(() => {});

    if (!v078ClockTimer && typeof windowObject.setInterval === "function") {
      v078ClockTimer = windowObject.setInterval(refresh, 15_000);

  async function refreshV078Weather(city) {
    const controller = windowObject.__PHONE_SIM__;
    const state = controller?.getState?.();
    if (!state) return false;
    const previous = v078WeatherFromState(state);
    const requestedCity = text(city, 48);
    const now = Date.now();
    if (!requestedCity) {
      state.deviceStatus = { weather: normalizeWeatherState({ requestedCity: "" }, now) };
      persistV072State(state);
      v078WeatherLoading = false;
      v078RefreshRenderedStatus();
      return false;
    }
    const pending = normalizeWeatherState({ ...previous, requestedCity, lastError: "", lastAttemptAt: now }, now);
    state.deviceStatus = { weather: pending };
    persistV072State(state);
    v078WeatherLoading = true;
    v078RefreshRenderedStatus();
    try {
      const weather = await fetchWeatherForCity(windowObject.fetch?.bind(windowObject), requestedCity, now);
      state.deviceStatus = { weather };
      persistV072State(state);
      return true;
    } catch (error) {
      const message = text(error?.message || "天气更新失败，请稍后重试。", 180);
      state.deviceStatus = { weather: normalizeWeatherState({ ...previous, requestedCity, lastAttemptAt: now, lastError: message }, now) };
      persistV072State(state);
      return false;
    } finally {
      v078WeatherLoading = false;
      v078RefreshRenderedStatus();
    }
  }

<script id="v079-content-flow">
(() => {
  "use strict";
  const win = window, doc = document;
  if (win.__PHONE_SIM_V079__) return;
  const controller = win.__PHONE_SIM__;
  if (!controller?.getState) return;
  win.__PHONE_SIM_V079__ = { version: "0.7.9" };

  const V070 = win.__PHONE_SIM_V070__ || {};
  const STORAGE_KEY = "rphub.phoneSimulator.v2";
  const runtime = { forum: false, live: false, timer: 0, pending: new Map(), stream: new Map(), ambientTimers: new Map() };
  const tags = ["学生区", "少妇区", "约炮区", "人妻区", "玩法分享", "欲望日记"];
  const max = (value, length = 180) => String(value ?? "").replace(/\s+/g, " ").trim().slice(0, length);
  const number = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
  const pick = list => list[Math.floor(Math.random() * list.length)] || "";
  const between = (low, high) => Math.floor(low + Math.random() * (high - low + 1));
  const stamp = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const current = () => controller.getState?.();
  const isInstalled = (state, appId) => Array.isArray(state?.installedApps) && state.installedApps.includes(appId);

  function persist(state) {
    try {
      const clean = typeof V070.sanitizeStateForStorage === "function" ? V070.sanitizeStateForStorage(state) : state;
      win.localStorage?.setItem(STORAGE_KEY, JSON.stringify(clean));
      return true;
    } catch { return false; }
  }

  function ensureFlow(state) {
    const now = Date.now();
    let changed = false;
    if (!state.v079ContentFlow || typeof state.v079ContentFlow !== "object") {
      state.v079ContentFlow = {};
      changed = true;
    }
    const flow = state.v079ContentFlow;
    if (!Number.isFinite(Number(flow.forumNextAt))) { flow.forumNextAt = now + between(25, 55) * 1000; changed = true; }
    if (!Number.isFinite(Number(flow.liveNextAt))) { flow.liveNextAt = now + between(70, 115) * 1000; changed = true; }
    if (!Array.isArray(flow.generatedForumIds)) { flow.generatedForumIds = []; changed = true; }
    if (!Array.isArray(flow.generatedLiveIds)) { flow.generatedLiveIds = []; changed = true; }
    return { flow, changed };
  }

  function modelSettings(state) {
    const settings = state?.modelSettings || {};
    const apiUrl = max(settings.apiUrl || settings.baseUrl || "", 500).replace(/\/+$/, "");
    const apiKey = max(settings.apiKey || settings.key || "", 1000);
    const model = max(settings.model || settings.modelName || "", 160);
    return { apiUrl, apiKey, model, temperature: clamp(number(settings.temperature, .85), 0, 2) };
  }

  function completionUrl(apiUrl) {
    if (/\/chat\/completions$/i.test(apiUrl)) return apiUrl;
    if (/\/v1$/i.test(apiUrl)) return `${apiUrl}/chat/completions`;
    return `${apiUrl}/v1/chat/completions`;
  }

  async function askModel(state, messages, temperature) {
    const settings = modelSettings(state);
    if (!settings.apiUrl || !settings.apiKey || !settings.model || typeof win.fetch !== "function") return "";
    const aborter = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = aborter ? win.setTimeout(() => aborter.abort(), 45_000) : 0;
    try {
      const response = await win.fetch(completionUrl(settings.apiUrl), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${settings.apiKey}` },
        body: JSON.stringify({ model: settings.model, messages, temperature: Number.isFinite(temperature) ? temperature : settings.temperature, stream: false }),
        signal: aborter?.signal,
      });
      if (!response.ok) throw new Error(`model ${response.status}`);
      const data = await response.json();
      return max(data?.choices?.[0]?.message?.content, 6000);
    } catch { return ""; }
    finally { if (timeout) win.clearTimeout(timeout); }
  }

  function jsonObject(raw) {
    const input = String(raw || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "");
    const candidates = [input];
    const match = input.match(/\{[\s\S]*\}/);
    if (match && match[0] !== input) candidates.push(match[0]);
    for (const candidate of candidates) try {
      const value = JSON.parse(candidate);
      if (value && typeof value === "object" && !Array.isArray(value)) return value;
    } catch {}
    return {};
  }

  function fallbackForum() {
    const author = pick(["岚岚", "南栀", "阿沐", "栖迟", "可乐冰", "晚风", "青柚", "弥生"]);
    const tag = pick(tags);
    const pair = pick([
      ["把需求说清以后，反而没有那么尴尬了", "之前总怕扫兴，后来发现提前讲边界、节奏和不舒服的点，过程反而轻松很多。想听听大家怎么开这个头。"],
      ["今晚的穿搭投票，选哪个更自然？", "本来只是想换个风格，结果朋友说第一套更有氛围。还在犹豫要不要把主动权交给现场投票。"],
      ["第一次见面前，有哪些细节最容易被忽略？", "不是流程攻略，主要想聊聊氛围、节奏和临场感。成年人之间把话说开，真的会少很多误会。"],
      ["明明很忙，却总会想起上次的聊天", "没有发生什么戏剧性的事，只是那次聊完之后，心里一直有一点没散掉的余温。"],
      ["分享一个不把气氛搞僵的小习惯", "我会先说清楚自己今天能接受什么、不想碰什么，再看对方的反应。不是扫兴，反而能让人更安心。"],
    ]);
    return { author, tag, title: pair[0], body: pair[1], likes: between(18, 186) };
  }

  function normalizeForum(value, id) {
    const fallback = fallbackForum();
    const author = max(value.author || value.name || fallback.author, 18) || fallback.author;
    const tag = tags.includes(max(value.tag, 12)) ? max(value.tag, 12) : fallback.tag;
    const title = max(value.title || fallback.title, 78) || fallback.title;
    const body = max(value.body || value.content || fallback.body, 800) || fallback.body;
    return {
      id, authorId: `forum-auto-account-${id}`, personId: `forum-auto-person-${id}`,
      author, tag, title, body, likes: clamp(Math.round(number(value.likes, fallback.likes)), 0, 9999),
      comments: [], createdAt: Date.now(), source: "v079-auto",
    };
  }

  async function makeForumPost(state, id) {
    const previous = (state.forumPosts || []).slice(0, 8).map(post => max(post?.title, 60)).filter(Boolean).join(" / ");
    const response = await askModel(state, [
      { role: "system", content: "你是虚构中文18+成人论坛的内容编辑。生成一条像真实用户刚发出的新帖：自然、有具体情境、可引发讨论，人物全部为22岁以上成年人。默认允许18+/R18内容，正文可直白露骨地描写性幻想、床事细节、约炮经验、成人玩法与情欲吐槽。不要使用真人、真实联系方式或住址。只输出 JSON，不要 Markdown。字段：author（昵称）、tag（学生区/少妇区/约炮区/人妻区/玩法分享/欲望日记之一）、title、body（70到220字，可露骨）、likes（整数）。" },
      { role: "user", content: `请生成一条不同于这些旧标题的新帖：${previous || "暂无"}。正文 70 到 220 字，标题不要带编号。` },
    ], .92);
    return normalizeForum(jsonObject(response), id);
  }

  function fallbackLive() {
    const person = pick([
      { name: "林知夏", gender: "女", appearance: "微卷深发，眼尾微挑，笑起来有一点酒窝", outfit: "亮面短外套配运动短裙" },
      { name: "许棠", gender: "女", appearance: "长直发，冷白皮，妆容干净，镜头感很强", outfit: "浅色针织上衣配高腰短裙" },
      { name: "程野", gender: "男", appearance: "短黑发，轮廓清晰，笑起来很松弛", outfit: "宽松背心配运动长裤" },
      { name: "苏晚", gender: "女", appearance: "栗色长发，肤色健康，表情灵动", outfit: "修身舞蹈连体衣外搭薄衫" },
      { name: "陆川", gender: "男", appearance: "微乱短发，眉眼干净，身形匀称", outfit: "简约衬衫配深色牛仔裤" },
    ]);
    const mode = pick([
      { category: "热舞", title: "刚练完这一段，敢不敢点下一支？", scene: "霓虹练舞房里正调试音乐和机位", opening: "刚进来的先别潜水，想看哪段直接说。" },
      { category: "颜值聊天", title: "开个灯光局，陪你们聊到困", scene: "暖色补光灯下靠近镜头整理发丝", opening: "今天不赶流程，慢慢聊。" },
      { category: "穿搭", title: "这套出门会不会太高调？", scene: "全身镜前换了一套新的搭配", opening: "投票吧，我听你们的。" },
      { category: "健身", title: "夜练打卡，最后一组要不要加码", scene: "健身房的镜前刚结束热身", opening: "别只看，陪我数最后几组。" },
      { category: "舞蹈 PK", title: "输了的人换歌，今晚别放水", scene: "双机位已经架好，节奏刚起", opening: "PK 已经开了，先站我这边。" },
    ]);
    return { ...person, ...mode };
  }

  function buildImagePrompt(room) {
    return max(`${room.hostName}, ${room.age}-year-old adult, ${room.gender}, ${room.appearance}, wearing ${room.outfit}, ${room.scene}, polished Chinese livestream keyframe, attractive lighting, consistent identity, no text, no UI`, 680);
  }

  function normalizeLive(value, id) {
    const fallback = fallbackLive();
    const hostName = max(value.hostName || value.name || fallback.name, 20) || fallback.name;
    const category = max(value.category || fallback.category, 24) || fallback.category;
    const title = max(value.title || fallback.title, 70) || fallback.title;
    const appearance = max(value.appearance || fallback.appearance, 180) || fallback.appearance;
    const outfit = max(value.outfit || fallback.outfit, 150) || fallback.outfit;
    const scene = max(value.scene || fallback.scene, 100) || fallback.scene;
    const age = clamp(Math.round(number(value.age, between(22, 32))), 22, 38);
    const gender = max(value.gender || fallback.gender, 8) || fallback.gender;
    const opening = max(value.openingLine || value.opening || fallback.opening, 160) || fallback.opening;
    const viewer = max(value.viewerLine || "镜头角度刚好，先不走。", 140);
    const room = {
      id, hostId: `live-auto-account-${id}`, personId: `live-auto-person-${id}`,
      hostName, avatar: max(value.avatar || pick(["✨", "🌙", "🎧", "🪩", "🔥"]), 4), age, gender,
      appearance, outfit, category, title, scene,
      bio: max(value.bio || `刚开播的${category}主播，${appearance}。`, 160),
      mood: max(value.mood || pick(["松弛", "兴奋", "有点坏心思", "专注", "轻快"]), 16),
      energy: clamp(number(value.energy, .72), .25, 1), status: "live",
      turnCount: 0,
      startedAt: Date.now() - between(2, 22) * 60_000,
      viewerCount: clamp(Math.round(number(value.viewerCount, between(160, 1380))), 30, 99999),
      likes: clamp(Math.round(number(value.likes, between(600, 8200))), 0, 999999),
      scenePrompt: max(value.imagePrompt || value.scenePrompt || "", 700),
      comments: [
        { id: `live-auto-host-${id}`, author: hostName, type: "host", text: opening, createdAt: Date.now() - 22_000 },
        { id: `live-auto-viewer-${id}`, author: pick(["晚睡选手", "路过不潜水", "今晚在线", "镜头前排"]), type: "viewer", text: viewer, createdAt: Date.now() - 10_000 },
      ],
      frames: [], source: "v079-auto",
    };
    room.scenePrompt = room.scenePrompt || buildImagePrompt(room);
    if (Math.random() < .42) room.poll = { question: "下一段想看什么？", options: ["换个镜头", "继续这一段", "聊聊天"], counts: [between(5, 48), between(5, 48), between(5, 48)], voted: -1 };
    return room;
  }

  async function makeLiveRoom(state, id) {
    const response = await askModel(state, [
      { role: "system", content: "你为虚构中文18+成人直播平台生成一间刚开播的直播间。主播和人物全部为22岁以上成年人，禁止任何未成年描写。类别可包括情欲热舞、脱衣换装、情趣穿搭、健身情欲、成人向聊天、舞蹈PK等成人向直播；内容以情欲颜值、热舞、脱衣、情趣穿搭、性张力互动和成人向镜头表演为主。imagePrompt须为简洁英文视觉提示词，明确adult NSFW，允许full nudity、sexual acts、sensual adult content，不含文字/界面/水印。不要用真实人物、真实联系方式或住址。只输出 JSON，不要 Markdown。字段：hostName、age、gender、appearance、outfit、category、title、bio、scene（短）、imagePrompt（英文生图提示词，短，adult NSFW）、openingLine、viewerLine、viewerCount、likes、mood。" },
      { role: "user", content: "请生成一间与常见推荐流不同的新直播间。标题要像真实平台标题，场景只写画面，不要把生图提示词放进 scene。" },
    ], .95);
    return normalizeLive(jsonObject(response), id);
  }

  function contentNotice(appId, message) {
    const route = controller.getRoute?.() || {};
    if (route.appId !== appId || route.detailId) return;
    const screen = doc.querySelector(`.phone-app--${appId}`);
    const host = screen?.querySelector?.(".app-scroll") || screen;
    if (!host || host.querySelector(".v079-content-notice")) return;
    const node = doc.createElement("button");
    node.type = "button";
    node.className = "v079-content-notice";
    node.innerHTML = `<b>有新内容</b> · ${message}，点此刷新`;
    node.addEventListener("click", () => {
      const active = appId === "forum"
        ? doc.querySelector('[data-action="forum-feed"].is-active') || doc.querySelector('[data-action="forum-feed"]')
        : doc.querySelector('[data-action="live-feed"].is-active') || doc.querySelector('[data-action="live-tab"].is-active');
      active?.click?.();
      node.remove();
    });
    host.prepend(node);
  }

  async function spawnForum() {
    const state = current();
    if (!state || runtime.forum || !isInstalled(state, "forum")) return;
    const { flow } = ensureFlow(state);
    runtime.forum = true;
    const token = `forum-${stamp()}`;
    flow.forumInFlight = token;
    flow.forumNextAt = Date.now() + between(16, 34) * 60_000;
    persist(state);
    try {
      const post = await makeForumPost(state, `forum-auto-${stamp()}`);
      const latest = current();
      if (!latest) return;
      const currentFlow = ensureFlow(latest).flow;
      if (currentFlow.forumInFlight !== token) return;
      const exists = Array.isArray(latest.forumPosts) && latest.forumPosts.some(item => item?.title === post.title || item?.id === post.id);
      if (!exists) latest.forumPosts = [post, ...(Array.isArray(latest.forumPosts) ? latest.forumPosts : [])].slice(0, 50);
      currentFlow.generatedForumIds = [...(currentFlow.generatedForumIds || []), post.id].slice(-60);
      currentFlow.forumInFlight = "";
      currentFlow.lastForumAt = Date.now();
      persist(latest);
      contentNotice("forum", "论坛刚出现一条新帖");
    } finally {
      runtime.forum = false;
      schedule();
    }
  }

  async function spawnLive() {
    const state = current();
    if (!state || runtime.live || !isInstalled(state, "live")) return;
    const { flow } = ensureFlow(state);
    runtime.live = true;
    const token = `live-${stamp()}`;
    flow.liveInFlight = token;
    flow.liveNextAt = Date.now() + between(23, 48) * 60_000;
    persist(state);
    try {
      const room = await makeLiveRoom(state, `live-auto-${stamp()}`);
      const latest = current();
      if (!latest) return;
      const currentFlow = ensureFlow(latest).flow;
      if (currentFlow.liveInFlight !== token) return;
      const rooms = Array.isArray(latest.liveRooms) ? latest.liveRooms : [];
      if (!rooms.some(item => item?.title === room.title || item?.id === room.id)) {
        const fixed = rooms.filter(item => !(item?.source === "v079-auto" && item?.status === "ended"));
        latest.liveRooms = [room, ...fixed].slice(0, 24);
      }
      currentFlow.generatedLiveIds = [...(currentFlow.generatedLiveIds || []), room.id].slice(-40);
      currentFlow.liveInFlight = "";
      currentFlow.lastLiveAt = Date.now();
      persist(latest);
      contentNotice("live", `${room.hostName} 刚开播`);
    } finally {
      runtime.live = false;
      schedule();
    }
  }

  function schedule() {
    if (runtime.timer) win.clearTimeout(runtime.timer);
    const state = current();
    if (!state) return;
    const { flow, changed } = ensureFlow(state);
    if (changed) persist(state);
    const now = Date.now();
    if (isInstalled(state, "forum") && now >= number(flow.forumNextAt, Infinity)) void spawnForum();
    if (isInstalled(state, "live") && now >= number(flow.liveNextAt, Infinity)) void spawnLive();
    const next = Math.min(number(flow.forumNextAt, now + 60_000), number(flow.liveNextAt, now + 60_000));
    runtime.timer = win.setTimeout(schedule, clamp(next - now, 1_200, 60_000));
  }

  function roomFor(roomId) {
    return current()?.liveRooms?.find?.(room => room?.id === roomId) || null;
  }

  function activeLiveRoomId() {
    const route = controller.getRoute?.() || {};
    return route.appId === "live" ? max(route.detailId, 120) : "";
  }

  function liveLines(room) {
    const chat = doc.querySelector(".phone-app--live .live-chat");
    const nodes = [...(chat?.querySelectorAll?.(".live-chat-line") || [])];
    const map = new Map();
    (room?.comments || []).forEach((comment, index) => { if (comment?.id && nodes[index]) map.set(comment.id, nodes[index]); });
    return { chat, map };
  }

  function addPendingNode(roomId, pending) {
    const chat = doc.querySelector(".phone-app--live .live-chat");
    if (!chat) return;
    let node = chat.querySelector(".v079-live-pending");
    if (!node) {
      node = doc.createElement("div");
      node.className = "v079-live-pending";
      chat.append(node);
    }
    const elapsed = Date.now() - pending.startedAt;
    const label = elapsed < 7_000 ? "弹幕已送达，主播正在看" : elapsed < 22_000 ? "主播在看弹幕，房间还在继续" : elapsed < 62_000 ? "镜头正在调整，互动还在排队" : "主播正在组织回应，不会整页刷新";
    const contentKey = `${roomId}|${label}`;
    if (node.dataset.v079Content !== contentKey) {
      node.innerHTML = `<b>${label}</b><i>···</i>`;
      node.dataset.v079Content = contentKey;
    }
    node.dataset.roomId = roomId;
  }

  function addAmbient(roomId, text) {
    const chat = doc.querySelector(".phone-app--live .live-chat");
    if (!chat || chat.querySelector(`[data-v079-ambient="${roomId}"][data-v079-ambient-text="${text}"]`)) return;
    const node = doc.createElement("p");
    node.className = "live-chat-line live-chat-line--viewer v079-live-ambient";
    node.dataset.v079Ambient = roomId;
    node.dataset.v079AmbientText = text;
    node.innerHTML = `<b>实时弹幕</b><span>${text}</span>`;
    chat.append(node);
    chat.scrollTop = chat.scrollHeight;
  }

  function clearPending(roomId) {
    runtime.pending.delete(roomId);
    const timer = runtime.ambientTimers.get(roomId);
    if (timer) timer.forEach(id => win.clearTimeout(id));
    runtime.ambientTimers.delete(roomId);
    doc.querySelectorAll(`[data-v079-ambient="${roomId}"], .v079-live-pending[data-room-id="${roomId}"]`).forEach(node => node.remove());
  }

  function stageBuffer(duration = 1300) {
    const stage = doc.querySelector(".phone-app--live .live-stage");
    if (!stage || stage.querySelector(".v079-live-stage-buffer")) return;
    const node = doc.createElement("div");
    node.className = "v079-live-stage-buffer";
    node.textContent = "主播正在切换镜头…";
    stage.append(node);
    win.setTimeout(() => node.remove(), duration);
  }

  function reveal(roomId, id) {
    const progress = runtime.stream.get(roomId);
    if (!progress) return;
    progress.visible.add(id);
    patchLive();
    const room = roomFor(roomId);
    const { chat } = liveLines(room);
    if (chat) chat.scrollTop = chat.scrollHeight;
  }

  function beginProgressive(roomId, responseIds) {
    if (!responseIds.length) return;
    let progress = runtime.stream.get(roomId);
    if (!progress) { progress = { ids: new Set(), visible: new Set() }; runtime.stream.set(roomId, progress); }
    const fresh = responseIds.filter(id => !progress.ids.has(id));
    fresh.forEach(id => progress.ids.add(id));
    if (!fresh.length) return;
    stageBuffer(900 + fresh.length * 680);
    fresh.forEach((id, index) => win.setTimeout(() => reveal(roomId, id), 420 + index * 720));
    win.setTimeout(() => { if (![...progress.ids].some(id => !progress.visible.has(id))) runtime.stream.delete(roomId); }, 1_500 + fresh.length * 780);
  }

  function patchLive() {
    const roomId = activeLiveRoomId();
    if (!roomId) return;
    const room = roomFor(roomId);
    if (!room) return;
    const pending = runtime.pending.get(roomId);
    const { map } = liveLines(room);
    const progress = runtime.stream.get(roomId);
    if (progress) {
      progress.ids.forEach(id => {
        const node = map.get(id);
        if (node) node.classList.toggle("v079-stream-hidden", !progress.visible.has(id));
      });
    }
    if (!pending) return;
    addPendingNode(roomId, pending);
    for (const comment of room.comments || []) {
      if (!comment?.id || pending.known.has(comment.id)) continue;
      if (comment.type === "me") { pending.known.add(comment.id); continue; }
      if (["host", "viewer", "system"].includes(comment.type)) pending.responses.add(comment.id);
    }
    if (pending.responses.size) {
      const ids = [...pending.responses];
      clearPending(roomId);
      beginProgressive(roomId, ids);
      return;
    }
    const error = current()?.liveRoomErrors?.[roomId];
    if (error) {
      const node = doc.querySelector(".v079-live-pending");
      if (node) node.innerHTML = "<b>这条弹幕暂时没有接上，房间仍在继续。</b>";
      win.setTimeout(() => clearPending(roomId), 3200);
    }
  }

  function watchLiveSubmission(event) {
    const form = event.target;
    if (!form?.matches?.("form[data-live-barrage]")) return;
    const roomId = max(form.dataset.roomId, 120);
    const text = max(form.querySelector('[name="barrage"]')?.value, 300);
    const room = roomFor(roomId);
    if (!roomId || !text || !room) return;
    clearPending(roomId);
    const pending = { startedAt: Date.now(), text, known: new Set((room.comments || []).map(comment => comment?.id).filter(Boolean)), responses: new Set() };
    runtime.pending.set(roomId, pending);
    const phrases = ["前排先别刷太快", "这条主播应该看见了", "等等镜头切过来", "评论区先留个位置"];
    const timers = [900, 3000, 7200].map((delay, index) => win.setTimeout(() => {
      if (runtime.pending.has(roomId)) { addAmbient(roomId, phrases[index]); addPendingNode(roomId, pending); }
    }, delay));
    runtime.ambientTimers.set(roomId, timers);
    win.setTimeout(() => patchLive(), 0);
  }

  doc.addEventListener("submit", watchLiveSubmission, true);
  const observer = typeof MutationObserver === "function" ? new MutationObserver(records => {
    const hasMeaningfulMutation = records.some(record => !record.target?.closest?.(".v079-live-pending"));
    if (hasMeaningfulMutation) patchLive();
  }) : null;
  observer?.observe(doc.documentElement, { childList: true, subtree: true });
  win.setInterval(() => patchLive(), 1100);
  win.addEventListener("beforeunload", () => { if (runtime.timer) win.clearTimeout(runtime.timer); observer?.disconnect(); });
  win.setTimeout(() => { patchLive(); schedule(); }, 0);
})();
</script>

    { appearance: "二十多岁，短发利落，笑起来有卧蚕，肤色偏小麦，身形结实。", voice: "很会接话，情绪外露些，但也有自己的节奏。", habit: "快", boundary: "开放", activity: "最近常在晚上出没" },
  ];
  const OTHER = [
    { appearance: "二十多岁，短发层次利落，五官清秀，穿搭偏中性，眼神很有辨识度。", voice: "表达随性、有自己的审美，不喜欢被贴标签。", habit: "普通", boundary: "普通", activity: "最近偶尔上线" },
    { appearance: "二十多岁，发色偏浅，五官柔和，常穿宽松针织和简洁配饰。", voice: "话不多但观察细，熟悉前会保留一点距离。", habit: "慢", boundary: "谨慎", activity: "正在过自己的生活" },
  ];

  function seededProfile(seed, name, source, supplied = {}) {
    const gender = normalizeGender(supplied.gender, seed);
    const pool = gender === "女" ? FEMALE : gender === "男" ? MALE : OTHER;
    const fallback = pickSeed(pool, seed, 1);
    const appearance = text(supplied.appearance || fallback.appearance, 240) || fallback.appearance;
    const speechStyle = text(supplied.speechStyle || fallback.voice, 180) || fallback.voice;
    const replyHabit = ["快", "普通", "慢"].includes(text(supplied.replyHabit, 8)) ? text(supplied.replyHabit, 8) : fallback.habit;
    const socialBoundary = ["开放", "普通", "谨慎"].includes(text(supplied.socialBoundary, 8)) ? text(supplied.socialBoundary, 8) : fallback.boundary;
    const activityStatus = text(supplied.activityStatus || fallback.activity, 48) || fallback.activity;
    const description = text(supplied.description || `${source}认识的成年人。说话风格：${speechStyle} 当前状态：${activityStatus}。`, 300);
    const relationshipPosture = text(supplied.relationshipPosture || `从${source}认识，刚刚建立联系，先自然了解彼此。`, 120);
    const prompt = text(supplied.prompt || `你是“${name}”。你是成年人，性别：${gender}；固定外貌：${appearance}。说话风格：${speechStyle}。回复习惯：${replyHabit}；社交边界：${socialBoundary}；当前生活状态：${activityStatus}。与玩家的认识来源：${source}。${relationshipPosture} 你有独立安排，不会因为刚认识就突然亲密。`, 760);
    return { gender, appearance, speechStyle, replyHabit, socialBoundary, activityStatus, description, relationshipPosture, prompt };
  }

  function isAutoForum(post) { return post?.source === "v079-auto" || post?.source === "v080-auto"; }
  function isAutoLive(room) { return room?.source === "v079-auto" || room?.source === "v080-auto"; }

  function mergeForumPost(post) {
    const personId = text(post?.personId || `forum-auto-person-${post?.id || hash(post?.author)}`, 90);
    const authorId = text(post?.authorId || `forum-auto-account-${post?.id || hash(post?.author)}`, 90);
    const profile = seededProfile(`forum|${personId}|${post?.author}`, text(post?.author, 24) || "论坛作者", "论坛", post);
    const merged = { ...post, personId, authorId, ...profile, source: post?.source || "v080-auto" };
    return globalThis.__PHONE_SIM_V125__?.enrichSourceEntity?.("forum", merged) || merged;
  }

  function mergeLiveRoom(room) {
    const personId = text(room?.personId || `live-auto-person-${room?.id || hash(room?.hostName)}`, 90);
    const hostId = text(room?.hostId || `live-auto-account-${room?.id || hash(room?.hostName)}`, 90);
    const profile = seededProfile(`live|${personId}|${room?.hostName}`, text(room?.hostName, 24) || "直播主播", "直播", room);
    const merged = { ...room, personId, hostId, ...profile, source: room?.source || "v080-auto" };
    return globalThis.__PHONE_SIM_V125__?.enrichSourceEntity?.("live", merged) || merged;
  }

  function needsProfile(entity) {
    return !text(entity?.gender, 8) || !text(entity?.appearance, 20) || !text(entity?.speechStyle, 12) || !text(entity?.replyHabit, 8) || !text(entity?.socialBoundary, 8) || !text(entity?.prompt, 40);
  }

  function reconcileGeneratedIdentities() {
    const state = current();
    if (!state || runtime.decorating) return;
    let next = state, changed = false;
    const forumPosts = Array.isArray(next.forumPosts) ? next.forumPosts : [];
    for (const original of forumPosts) {
      if (!isAutoForum(original)) continue;
      const post = mergeForumPost(original);
      if (needsProfile(original)) {
        next = { ...next, forumPosts: (next.forumPosts || []).map(item => item?.id === original.id ? post : item) };
        changed = true;
      }
      const person = next.people?.[post.personId];
      const account = person?.accounts?.forum;
      if (!person || !account?.id || text(person.gender, 8) !== post.gender || text(person.appearance, 240) !== post.appearance || !text(person.description, 300).includes("说话风格")) {
        next = typeof NPC.bindForumAuthor === "function" ? NPC.bindForumAuthor(next, post) : next;
        changed = true;
      }
    }
    const liveRooms = Array.isArray(next.liveRooms) ? next.liveRooms : [];
    for (const original of liveRooms) {
      if (!isAutoLive(original)) continue;
      const room = mergeLiveRoom(original);
      if (needsProfile(original)) {
        next = { ...next, liveRooms: (next.liveRooms || []).map(item => item?.id === original.id ? room : item) };
        changed = true;
      }
      const person = next.people?.[room.personId];
      const account = person?.accounts?.live;
      if (!person || !account?.id || text(person.gender, 8) !== room.gender || text(person.appearance, 240) !== room.appearance || !text(person.description, 300).includes("说话风格")) {
        next = typeof NPC.bindLiveHost === "function" ? NPC.bindLiveHost(next, room) : next;
        changed = true;
      }
    }
    if (changed) {
      Object.assign(state, next);
      persist(state);
    }
  }

  function sourceEntity(state, personId) {
    const room = (state?.liveRooms || []).find(item => item?.personId === personId);
    if (room) return mergeLiveRoom(room);
    const post = (state?.forumPosts || []).find(item => item?.personId === personId);
    if (post) return mergeForumPost(post);
    const person = state?.people?.[personId] || {};
    return seededProfile(`person|${personId}|${person?.name}`, text(person?.name, 24) || "联系人", text(person?.source, 40) || "关联内容", person);
  }

  function contactFor(state, appId, personId) {
    return (state?.customContacts?.[appId] || []).find(contact => contact?.kind !== "group" && contact?.personId === personId) || null;
  }

  function ensureDirectContact(state, appId, personId) {
    const old = contactFor(state, appId, personId);
    if (old) return { state, contact: old, created: false };
    const entity = sourceEntity(state, personId);
    const person = state.people?.[personId] || {};
    const name = text(entity.hostName || entity.author || person.name, 24) || "新联系人";
    const source = entity.hostName ? "直播" : "论坛";
    const profile = seededProfile(`contact|${personId}|${appId}`, name, source, { ...person, ...entity });
    let next = state;
    const generatedId = `${appId}-v080-${hash(personId).toString(36)}`;
    if (typeof NPC.registerPersonAccount === "function") {
      next = NPC.registerPersonAccount(next, {
        id: personId, personId, name, gender: profile.gender, appearance: profile.appearance,
        description: profile.description, source, sourceIntent: entity.sourceIntent,
      }, appId, { id: generatedId, aliases: [name], discovered: true });
    }
    const accountId = text(next.people?.[personId]?.accounts?.[appId]?.id, 90) || generatedId;
    const contact = {
      id: accountId, personId, name, kind: "direct", avatar: name.slice(0, 1),
      gender: profile.gender, appearance: profile.appearance, description: profile.description,
      source: `从${source}认识`, sourceIntent: globalThis.__PHONE_SIM_V125__?.normalizeSourceIntent?.(entity.sourceIntent), socialBoundary: profile.socialBoundary, replyHabit: profile.replyHabit,
      activityStatus: profile.activityStatus, relationshipPosture: profile.relationshipPosture, prompt: profile.prompt,
      last: `通过${source}认识，刚加上好友`,
    };
    next = {
      ...next,
      customContacts: { ...(next.customContacts || {}), [appId]: [...(next.customContacts?.[appId] || []), contact].slice(-60) },
      localMessages: {
        ...(next.localMessages || {}),
        [appId]: {
          ...(next.localMessages?.[appId] || {}),
          [accountId]: [{ id: `v080-system-${Date.now().toString(36)}`, side: "system", type: "text", name: "系统", text: `你通过${source}添加了 ${name}。先从自然聊天开始。`, createdAt: Date.now() }],
        },
      },
    };
    return { state: next, contact, created: true };
  }

  function openContact(appId, personId) {
    const state = current();
    if (!state) return;
    if (!Array.isArray(state.installedApps) || !state.installedApps.includes(appId)) {
      showToast("请先在软件商店安装这个应用。");
      return;
    }
    const result = ensureDirectContact(state, appId, personId);
    Object.assign(state, result.state);
    persist(state);
    const opened = controller.openKnownAccount?.(appId, result.contact.id);
    showToast(result.created ? `已添加 ${result.contact.name}，正在打开聊天。` : `正在打开与 ${result.contact.name} 的聊天。`);
    if (!opened) decorate();
  }

  function wallet(state, now = Date.now()) {
    const today = dateKey(now), month = monthKey(now);
    let changed = false;
    if (!state.liveWallet || typeof state.liveWallet !== "object") {
      state.liveWallet = {
        version: 1, enabled: true, balance: 1200, lifetimeEarned: 1200, lifetimeSpent: 0,
        monthlySpent: 0, monthKey: month, dailyKey: today, dailyClaimed: false,
        tasks: { room: false, barrage: false, forum: false },
        history: [{ id: `welcome-${now}`, kind: "welcome", amount: 1200, label: "入驻映币福利", at: now }],
      };
      changed = true;
    }
    const store = state.liveWallet;
    store.enabled = store.enabled !== false;
    store.balance = clamp(Math.floor(number(store.balance, 0)), 0, 9999999);
    store.lifetimeEarned = clamp(Math.floor(number(store.lifetimeEarned, 0)), 0, 99999999);
    store.lifetimeSpent = clamp(Math.floor(number(store.lifetimeSpent, 0)), 0, 99999999);
    if (!Array.isArray(store.history)) { store.history = []; changed = true; }
    if (store.dailyKey !== today) {
      store.dailyKey = today; store.dailyClaimed = false; store.tasks = { room: false, barrage: false, forum: false }; changed = true;
    }
    if (store.monthKey !== month) { store.monthKey = month; store.monthlySpent = 0; changed = true; }
    store.tasks = { room: store.tasks?.room === true, barrage: store.tasks?.barrage === true, forum: store.tasks?.forum === true };
    return { store, changed };
  }

  function recordWallet(state, kind, amount, label, now = Date.now()) {
    const { store } = wallet(state, now);
    const value = Math.max(0, Math.floor(number(amount, 0)));
    if (!value) return false;
    store.balance = clamp(store.balance + value, 0, 9999999);
    store.lifetimeEarned = clamp(store.lifetimeEarned + value, 0, 99999999);
    store.history = [...store.history, { id: `${kind}-${now}-${hash(label).toString(36)}`, kind, amount: value, label: text(label, 80), at: now }].slice(-120);
    return true;
  }

  function awardTask(kind, amount, label) {
    const state = current();
    if (!state) return false;
    const { store, changed } = wallet(state);
    if (changed) persist(state);
    if (store.tasks?.[kind] === true) return false;
    store.tasks[kind] = true;
    recordWallet(state, `task-${kind}`, amount, label);
    persist(state);
    showToast(`${label} +${amount} 映币`);
    decorate();
    return true;
  }

  function claimDaily() {
    const state = current();
    if (!state) return;
    const { store } = wallet(state);
    if (store.dailyClaimed) { showToast("今天已经签到过了。 "); return; }
    store.dailyClaimed = true;
    recordWallet(state, "daily", 180, "每日签到");
    persist(state);
    showToast("每日签到 +180 映币");
    openWallet();
  }

  function spendCoins(state, cost, label, now = Date.now()) {
    const { store } = wallet(state, now);
    const value = Math.max(0, Math.floor(number(cost, 0)));
    if (store.balance < value) return false;
    store.balance -= value;
    store.lifetimeSpent = clamp(store.lifetimeSpent + value, 0, 99999999);
    store.monthlySpent = clamp(number(store.monthlySpent, 0) + value, 0, 99999999);
    store.history = [...store.history, { id: `spend-${now}-${hash(label).toString(36)}`, kind: "spend", amount: -value, label: text(label, 80), at: now }].slice(-120);
    return true;
  }

  function walletSummary(state) {
    const { store } = wallet(state);
    return store;
  }

  function showToast(message) {
    const phone = doc.getElementById("phoneRoot");
    if (!phone) return;
    doc.getElementById("v080CoinToast")?.remove();
    const node = doc.createElement("div");
    node.id = "v080CoinToast";
    node.className = "v080-coin-toast";
    node.innerHTML = `<b>映币</b> · ${escapeHtml(message)}`;
    phone.append(node);
    if (runtime.toastTimer) win.clearTimeout(runtime.toastTimer);
    runtime.toastTimer = win.setTimeout(() => node.remove(), 2800);
  }

  function taskRow(done, name, amount, detail) {
    return `<div class="v080-wallet-task${done ? " is-done" : ""}"><i>${done ? "✓" : "○"}</i><div><b>${escapeHtml(name)}</b><span>${escapeHtml(detail)}</span></div><small>${done ? "已领取" : `+${amount}`}</small></div>`;
  }

  function closeWallet() { doc.getElementById("v080WalletSheet")?.remove(); }
  function openWallet() {
    closeWallet();
    const state = current();

    const store = walletSummary(state);

    const sheet = doc.createElement("section");

    doc.getElementById("phoneRoot")?.append(sheet);
  }

  function updateGiftPanel() {
    const sheet = doc.getElementById("v072GiftSheet");
    const state = current();
    if (!sheet || !state) return;
    const store = walletSummary(state);
    const card = sheet.querySelector(".v072-gift-card");
    const subtitle = card?.querySelector(".v072-sheet-title span");
    if (subtitle) subtitle.textContent = "使用映币送礼；礼物会保留为本卡内的互动记录";
    let balance = card?.querySelector(".v080-gift-balance");
    if (!balance && card) {
      balance = doc.createElement("p");
      balance.className = "v080-gift-balance";
      card.querySelector(".v072-gift-quantity")?.insertAdjacentElement("afterend", balance);
    }
    const quantity = Math.max(1, number(sheet.querySelector('[name="v072-gift-quantity"]')?.value, 1));
    if (balance) balance.innerHTML = `余额 <b>${store.balance.toLocaleString()} 映币</b> · 本次按数量扣除`;
    const catalog = Array.isArray(NPC.giftCatalog) ? NPC.giftCatalog : [];
    sheet.querySelectorAll('[data-action="send-v072-gift"]').forEach(button => {
      const gift = catalog.find(item => item.id === button.dataset.giftId);
      if (!gift) return;
      const cost = Math.max(0, number(gift.price, 0) * quantity);
      const price = button.querySelector("span");
      if (price) price.textContent = `${cost.toLocaleString()} 映币`;
      button.disabled = store.balance < cost;
      button.title = store.balance < cost ? "映币不足，可在映币账户查看每日获取途径" : "";
    });
    const foot = card?.querySelector("p:last-child");
    if (foot && !foot.classList.contains("v080-gift-balance")) foot.textContent = "礼物会影响主播是否注意到这次互动，但不会自动换取关系或私下联系方式。";
  }

  function sendGift(button, event) {
    event.preventDefault();
    event.stopImmediatePropagation();
    const state = current();
    const roomId = text(button.dataset.roomId, 100);
    const room = state?.liveRooms?.find(item => item?.id === roomId);
    const gift = (Array.isArray(NPC.giftCatalog) ? NPC.giftCatalog : []).find(item => item.id === button.dataset.giftId);
    const quantity = Math.max(1, number(doc.querySelector('#v072GiftSheet [name="v072-gift-quantity"]')?.value, 1));
    if (!state || !room || !gift) return;
    const cost = Math.max(0, number(gift.price, 0) * quantity);
    if (!spendCoins(state, cost, `${gift.name} ×${quantity}`)) {
      giftStatus("映币不足。每日签到和三项首次互动都会获得映币。");
      updateGiftPanel();
      return;
    }
    let next = typeof NPC.recordGift === "function" ? NPC.recordGift(state, room, gift, quantity) : state;
    if (next !== state) Object.assign(state, next);
    const latest = Array.isArray(state.giftLedger) ? state.giftLedger.at(-1) : null;
    if (latest) latest.currency = "映币";
    persist(state);
    const chat = doc.querySelector(".phone-app--live .live-chat");
    if (chat) {
      const notice = doc.createElement("div");
      notice.className = "v072-gift-notice";
      notice.textContent = `你送出了 ${gift.name} × ${quantity}（-${cost.toLocaleString()} 映币）`;
      chat.append(notice);
      chat.scrollTop = chat.scrollHeight;
    }
    doc.getElementById("v072GiftSheet")?.remove();
    controller.enqueueLifeEvent?.({ id: `v080-gift-reply-${Date.now()}`, type: "live_turn", appId: "live", targetId: room.id, dueAt: Date.now() + 600, userText: `[映币礼物] 玩家送出${gift.name}×${quantity}，本场共消耗${cost}映币。把它视为平台内支持信号，自然回应，不承诺私联或越界服务。`, attempt: 0 });
    persist(state);
    showToast(`送礼成功 · -${cost.toLocaleString()} 映币`);
    decorate();
  }

  function overrideGiftContext() {
    if (NPC.__v080GiftContext || typeof NPC.giftContext !== "function") return;
    NPC.__v080GiftContext = NPC.giftContext;
    NPC.giftContext = (state = {}, roomId = "") => {
      const entries = (Array.isArray(state.giftLedger) ? state.giftLedger : []).filter(entry => entry?.roomId === roomId);
      const total = entries.reduce((sum, entry) => sum + Math.max(0, number(entry?.grossValue, 0)), 0);
      if (!total) return "本场尚未收到玩家礼物。";
      return `玩家在本场累计送出${total}映币的礼物。它是模拟平台内的支持信号，可影响是否被注意到，但不能购买亲密关系、私联、联系方式或越界服务。`;
    };
  }

  function maybeRewardLiveVisit() {
    const route = controller.getRoute?.() || {};
    if (route.appId !== "live" || !route.detailId || route.detailId === runtime.lastVisitedRoomId) return;
    const room = (current()?.liveRooms || []).find(item => item?.id === route.detailId);
    if (!room) return;
    runtime.lastVisitedRoomId = room.id;
    awardTask("room", 70, "首次进入直播间");
  }

  function decorate() {
    if (runtime.decorating) return;
    runtime.decorating = true;
    try {
      addLiveWalletChip();
      updateGiftPanel();
      decorateIdentityActions();
      decorateSearchForms();
    } finally { runtime.decorating = false; }
  }

  doc.addEventListener("click", event => {
    const actionTarget = event.target?.closest?.("[data-action]");
    const action = actionTarget?.dataset?.action;
    if (action === "open-live-profile") runtime.lastLiveProfileRoomId = text(actionTarget.dataset.roomId, 100);
    if (action === "v080-open-wallet") { event.preventDefault(); event.stopImmediatePropagation(); openWallet(); return; }
    if (action === "v080-close-wallet") { event.preventDefault(); event.stopImmediatePropagation(); closeWallet(); return; }
    if (action === "v080-claim-daily") { event.preventDefault(); event.stopImmediatePropagation(); claimDaily(); return; }
    if (action === "v080-random-search-profile") { event.preventDefault(); event.stopImmediatePropagation(); fillSearchProfile(actionTarget.closest("form[data-contact-search]"), true); showToast("已随机生成性别与固定外貌。"); return; }
    if (action === "v080-open-person") { event.preventDefault(); event.stopImmediatePropagation(); openContact(text(actionTarget.dataset.appId, 16), text(actionTarget.dataset.personId, 90)); return; }
    if (action === "send-v072-gift") { sendGift(actionTarget, event); return; }
    if (action === "open-gift-panel") win.setTimeout(updateGiftPanel, 0);
  }, true);

  doc.addEventListener("change", event => {
    if (event.target?.matches?.('#v072GiftSheet [name="v072-gift-quantity"]')) updateGiftPanel();
  }, true);

  doc.addEventListener("submit", event => {
    const form = event.target;
    if (!form) return;
    if (form.matches?.("form[data-contact-search]") && form.dataset.kind !== "group") fillSearchProfile(form, false);
    if (form.matches?.("form[data-live-barrage]")) {
      const message = text(form.querySelector('[name="barrage"]')?.value, 300);
      if (message) awardTask("barrage", 90, "首次发送有效弹幕");
    }
    if (form.matches?.("form[data-forum-reply]")) {
      const reply = text(form.querySelector('[name="reply"]')?.value, 500);
      if (reply) awardTask("forum", 80, "首次论坛互动");
    }
    if (form.matches?.("form[data-forum-form]")) {
      const title = text(form.querySelector('[name="title"]')?.value, 80);
      const body = text(form.querySelector('[name="body"]')?.value, 500);
      if (title && body) awardTask("forum", 80, "首次论坛互动");
    }
  }, true);

  overrideGiftContext();
  runtime.observer = typeof MutationObserver === "function" ? new MutationObserver(() => win.setTimeout(decorate, 0)) : null;
  runtime.observer?.observe(doc.documentElement, { childList: true, subtree: true });
  runtime.timer = win.setInterval(() => { reconcileGeneratedIdentities(); maybeRewardLiveVisit(); decorate(); }, 1300);
  win.addEventListener("beforeunload", () => { runtime.observer?.disconnect(); if (runtime.timer) win.clearInterval(runtime.timer); });
  win.setTimeout(() => { reconcileGeneratedIdentities(); maybeRewardLiveVisit(); decorate(); }, 40);
})();
</script>
